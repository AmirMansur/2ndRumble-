          package com.rbu.uploader

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          object Notifier {
              const val CH_RUN = "rbu_channel"
              const val CH_RESUME = "rbu_resume"
              const val ID_RUN = 1
              const val ID_RESUME = 2
              const val ACTION_STOP = "com.rbu.uploader.STOP"

              private fun ensureChannels(ctx: Context) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = ctx.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel(CH_RUN, "Rumble Uploader", NotificationManager.IMPORTANCE_LOW))
                      nm.createNotificationChannel(NotificationChannel(CH_RESUME, "Rumble Uploader - resume", NotificationManager.IMPORTANCE_HIGH))
                  }
              }

              private fun builder(ctx: Context, channel: String): Notification.Builder =
                  if (Build.VERSION.SDK_INT >= 26) Notification.Builder(ctx, channel) else Notification.Builder(ctx)

              private fun openIntent(ctx: Context, auto: Boolean): PendingIntent {
                  val i = Intent(ctx, MainActivity::class.java)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  if (auto) i.putExtra("auto", true)
                  return PendingIntent.getActivity(ctx, if (auto) 11 else 10, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              fun running(ctx: Context, text: String): Notification {
                  ensureChannels(ctx)
                  val stopIntent = Intent(ctx, ControlReceiver::class.java)
                  stopIntent.action = ACTION_STOP
                  val stop = PendingIntent.getBroadcast(ctx, 12, stopIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return builder(ctx, CH_RUN)
                      .setContentTitle("Rumble Uploader")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.stat_sys_upload)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(openIntent(ctx, false))
                      .addAction(0, "Stop", stop)
                      .build()
              }

              fun update(ctx: Context, text: String) {
                  try {
                      ctx.getSystemService(NotificationManager::class.java).notify(ID_RUN, running(ctx, text))
                  } catch (e: Exception) { }
              }

              fun postResume(ctx: Context, text: String) {
                  try {
                      ensureChannels(ctx)
                      val n = builder(ctx, CH_RESUME)
                          .setContentTitle("Rumble Uploader - tap to continue")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.stat_sys_upload_done)
                          .setAutoCancel(true)
                          .setContentIntent(openIntent(ctx, true))
                          .build()
                      ctx.getSystemService(NotificationManager::class.java).notify(ID_RESUME, n)
                  } catch (e: Exception) { }
              }

              fun cancelResume(ctx: Context) {
                  try { ctx.getSystemService(NotificationManager::class.java).cancel(ID_RESUME) } catch (e: Exception) { }
              }
          }
