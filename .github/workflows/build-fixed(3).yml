              private var rehanded = false
              @Volatile private var cell: Network? = null
              private var cellCb: ConnectivityManager.NetworkCallback? = null

              private val main = Handler(Looper.getMainLooper())
              private val listeners = CopyOnWriteArrayList<() -> Unit>()
              private var lastNotify = 0L
              private val logBuf = StringBuilder()
              @Volatile var logVersion = 0

              @Synchronized
              fun init(ctx: Context) {
                  if (inited) return
                  app = ctx.applicationContext
                  prefs = app.getSharedPreferences("rbu_dl", Context.MODE_PRIVATE)
                  rbu = app.getSharedPreferences("rbu", Context.MODE_PRIVATE)
                  inited = true
                  load()
                  watchCell()
              }

              // ---------- listeners / log ----------
              fun addListener(l: () -> Unit) { if (!listeners.contains(l)) listeners.add(l) }
              fun removeListener(l: () -> Unit) { listeners.remove(l) }

              fun changed(force: Boolean = false) {
                  val now = SystemClock.elapsedRealtime()
                  if (!force && now - lastNotify < 400) return
                  lastNotify = now
                  main.post {
                      for (l in listeners) {
                          try { l() } catch (e: Exception) { }
                      }
                  }
              }

              fun log(m: String) {
                  synchronized(logBuf) {
                      logBuf.append(m).append('\n')
                      if (logBuf.length > 30000) logBuf.delete(0, logBuf.length - 20000)
                      logVersion++
                  }
                  changed(true)
              }

              fun logSnapshot(): String = synchronized(logBuf) { logBuf.toString() }

              fun clearLog() {
                  synchronized(logBuf) {
                      logBuf.setLength(0)
                      logVersion++
                  }
                  changed(true)
              }

              fun warn(msg: String) {
                  log("⚠ " + msg)
                  lastWarning = msg
                  try {
                      channels()
                      val n = builder(CH_WARN)
                          .setContentTitle("Rumble Uploader - downloads")
                          .setContentText(msg)
                          .setStyle(Notification.BigTextStyle().bigText(msg))
                          .setSmallIcon(android.R.drawable.stat_sys_warning)
                          .setAutoCancel(true)
                          .setContentIntent(openDownloads())
                          .build()
                      app.getSystemService(NotificationManager::class.java).notify(ID_WARN, n)
                  } catch (e: Exception) { }
                  changed(true)
              }

              // ---------- notifications ----------
              private fun channels() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = app.getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(NotificationChannel(CH_RUN, "Rumble Uploader - downloads", NotificationManager.IMPORTANCE_LOW))
                      nm.createNotificationChannel(NotificationChannel(CH_WARN, "Rumble Uploader - download warnings", NotificationManager.IMPORTANCE_HIGH))
                  }
              }

              private fun builder(ch: String): Notification.Builder =
                  if (Build.VERSION.SDK_INT >= 26) Notification.Builder(app, ch) else Notification.Builder(app)

              private fun openDownloads(): PendingIntent {
                  val i = Intent(app, DownloadActivity::class.java)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  return PendingIntent.getActivity(app, 31, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              fun notification(): Notification {
                  channels()
                  return builder(CH_RUN)
                      .setContentTitle("Rumble Uploader - downloads")
                      .setContentText(summary())
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(openDownloads())
                      .build()
              }

              fun updateNotification() {
                  try { app.getSystemService(NotificationManager::class.java).notify(ID_RUN, notification()) } catch (e: Exception) { }
              }

              // ---------- network: downloads use mobile data, uploads use Wi-Fi ----------
              fun anyNet(): Boolean = rbu.getBoolean("dl_any_net", false)

              fun setAnyNet(on: Boolean) {
                  rbu.edit().putBoolean("dl_any_net", on).apply()
                  log(if (on) "Downloads may use Wi-Fi or mobile data." else "Downloads use mobile data only (Wi-Fi is kept for uploads).")
                  changed(true)
                  ensureWorker()
              }

              private fun watchCell() {
                  if (cellCb != null) return
                  try {
                      val cm = app.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val req = NetworkRequest.Builder()
                          .addTransportType(NetworkCapabilities.TRANSPORT_CELLULAR)
                          .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          .build()
                      val cb = object : ConnectivityManager.NetworkCallback() {
                          override fun onAvailable(network: Network) { cell = network }
                          override fun onLost(network: Network) { if (cell == network) cell = null }
                      }
                      cm.requestNetwork(req, cb)
                      cellCb = cb
                  } catch (e: Exception) { }
              }

              // ---------- folder + space ----------
              fun tree(): Uri? {
                  val s = prefs.getString("tree", null) ?: return null
                  return try { Uri.parse(s) } catch (e: Exception) { null }
              }

              fun setTree(u: Uri) {
                  prefs.edit().putString("tree", u.toString()).apply()
                  lowWarned = false
                  log("Download folder: " + treeName())
                  changed(true)
                  ensureWorker()
              }

              fun treeName(): String {
                  val t = tree() ?: return "(none)"
                  return try {
                      val doc = DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                      val name: String? = app.contentResolver.query(doc, arrayOf(DocumentsContract.Document.COLUMN_DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(0) else null
                      }
                      name ?: "(folder)"
                  } catch (e: Exception) { "(folder)" }
              }

              fun freeBytes(): Long {
                  try {
                      val t = tree()
                      val vol = if (t != null) DocumentsContract.getTreeDocumentId(t).substringBefore(':') else "primary"
                      if (vol != "primary") {
                          for (f in app.getExternalFilesDirs(null)) {
                              if (f != null && f.absolutePath.contains("/" + vol + "/")) {
                                  return StatFs(f.absolutePath).availableBytes
                              }
                          }
                      }
                      return StatFs(Environment.getExternalStorageDirectory().absolutePath).availableBytes
                  } catch (e: Exception) {
                      return try { StatFs(app.filesDir.absolutePath).availableBytes } catch (e2: Exception) { 0L }
                  }
              }

              fun fmt(b: Long): String {
                  if (b < 0L) return "?"
                  val mb = b / 1048576.0
                  return if (mb >= 1024.0) String.format(java.util.Locale.US, "%.2f GB", mb / 1024.0)
                  else String.format(java.util.Locale.US, "%.1f MB", mb)
              }

              // ---------- queue ----------
              fun hasWork(): Boolean = items.any { it.status == "queued" || it.status == "downloading" }

              fun activeCount(): Int = items.count { it.status == "queued" || it.status == "downloading" }

              fun handedCount(): Int = items.count { it.status == "handed" }

              private fun sha(s: String): String {
                  val d = MessageDigest.getInstance("SHA-256").digest(s.toByteArray())
                  val sb = StringBuilder()
                  for (i in 0 until 12) sb.append(String.format("%02x", d[i]))
                  return sb.toString()
              }

              fun enqueue(url: String, name: String, mime: String, ua: String, referer: String) {
                  if (!url.startsWith("http://", true) && !url.startsWith("https://", true)) {
                      warn("This kind of link (" + url.substringBefore(':') + ":) is created inside the page and can't be downloaded. Look for a normal download link on the site.")
                      return
                  }
                  val key = sha(url)
                  if (items.any { it.key == key && (it.status == "queued" || it.status == "downloading" || it.status == "handed") }) {
                      log("Already in the list: " + name)
                      return
                  }
                  val doneKeys = rbu.getStringSet("dl_uploaded_keys", emptySet()) ?: emptySet()
                  if (doneKeys.contains(key)) {
                      log("Already uploaded earlier, skipped: " + name)
                      return
                  }
                  items.removeAll { it.key == key }
                  val ck = try { CookieManager.getInstance().getCookie(url) ?: "" } catch (e: Throwable) { "" }
                  val item = DlItem(key, url, name, mime, ua, ck, referer)
                  items.add(item)
                  trim()
                  log("⬇ " + name)
                  save()
                  changed(true)
                  ensureWorker()
              }

              fun cancel(item: DlItem) {
                  item.cancel = true
                  if (item.status == "queued") {
                      item.status = "canceled"
                      item.detail = "Canceled"
                  }
                  save()
                  changed(true)
              }

              fun retryDownload(item: DlItem) {
                  if (item.status == "failed" || item.status == "canceled") {
                      item.status = "queued"
                      item.detail = ""
                      item.cancel = false
                      item.done = 0L
                      save()
                      changed(true)
                      ensureWorker()
                  }
              }

              fun remove(item: DlItem) {
                  if (item.status == "queued" || item.status == "downloading") return
                  items.remove(item)
                  save()
                  changed(true)
              }

              fun clearFinished() {
                  items.removeAll { it.status == "done" || it.status == "failed" || it.status == "canceled" || it.status == "uploaded" }
                  save()
                  changed(true)
              }

              private fun trim() {
                  while (items.size > 200) {
                      val old = items.firstOrNull { it.status == "done" || it.status == "failed" || it.status == "canceled" || it.status == "uploaded" } ?: break
                      items.remove(old)
                  }
              }

              fun summary(): String {
                  val c = currentItem
                  val head = if (c != null) {
                      "Downloading " + (if (c.total > 0) (c.done * 100 / c.total).toString() + "%" else fmt(c.done))
                  } else if (blockReason != null) {
                      "Paused"
                  } else {
                      "Idle"
                  }
                  val up = handedCount()
                  return head + " • " + activeCount() + " left" + (if (up > 0) " • " + up + " uploading" else "") + " • " + fmt(freeBytes()) + " free"
              }

              // ---------- persistence ----------
              fun save() {
                  try {
                      val a = JSONArray()
                      for (x in items) {
                          a.put(
                              JSONObject().put("key", x.key).put("url", x.url).put("name", x.name).put("mime", x.mime)
                                  .put("ua", x.ua).put("cookie", x.cookie).put("referer", x.referer)
                                  .put("status", x.status).put("detail", x.detail).put("part", x.partUri).put("doc", x.doc)
                          )
                      }
                      prefs.edit().putString("items", a.toString()).apply()
                  } catch (e: Exception) { }
              }

              private fun load() {
                  try {
                      val a = JSONArray(prefs.getString("items", "[]"))
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          val x = DlItem(o.getString("key"), o.getString("url"), o.optString("name"), o.optString("mime"),
                              o.optString("ua"), o.optString("cookie"), o.optString("referer"))
                          x.status = o.optString("status", "queued")
                          x.detail = o.optString("detail")
                          x.partUri = o.optString("part")
                          x.doc = o.optString("doc")
                          if (x.status == "downloading") {
                              if (x.partUri.isNotEmpty()) deleteQuiet(Uri.parse(x.partUri))
                              x.partUri = ""
                              x.status = "queued"
                              x.detail = "Restarted after interruption"
                          }
                          x.warned = true
                          x.handedAt = SystemClock.elapsedRealtime()
                          items.add(x)
                      }
                  } catch (e: Exception) { }
              }

              // ---------- worker ----------
              fun startService() {
                  try {
                      val i = Intent(app, DlService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) app.startForegroundService(i) else app.startService(i)
                  } catch (e: Exception) { }
              }

              /** Called when the app process starts again (watchdog / service restart). */
              fun resume(ctx: Context) {
                  init(ctx)
                  if (!rehanded) {
                      rehanded = true
                      if (MainActivity.instance == null) {
                          for (it in items) {
                              if (it.status == "handed" && it.doc.isNotEmpty()) {
                                  log("Sending " + it.name + " to the uploader again")
                                  handToUploader(it, Uri.parse(it.doc))
                              }
                          }
                      }
                  }
                  if (hasWork()) {
                      ensureWorker()
                      startService()
                  }
              }

              @Synchronized
              fun ensureWorker() {
                  if (!inited) return
                  if (workerRunning) return
                  if (items.none { it.status == "queued" }) return
                  workerRunning = true
                  startService()
                  Thread {
                      try {
                          loop()
                      } catch (e: Throwable) {
                      } finally {
                          workerRunning = false
                          currentItem = null
                          blockReason = null
                          changed(true)
                          if (items.any { it.status == "queued" }) ensureWorker()
                      }
                  }.start()
              }

              private fun sleepMs(ms: Long) {
                  try { Thread.sleep(ms) } catch (e: InterruptedException) { }
              }

              private fun loop() {
                  while (true) {
                      val item = items.firstOrNull { it.status == "queued" } ?: return
                      while (item.status == "queued") {
                          if (tree() == null) {
                              blockReason = "Choose a download folder first (Select folder)."
                              changed()
                              sleepMs(2000)
                              continue
                          }
                          if (!anyNet() && cell == null) {
                              blockReason = "Waiting for mobile data. Downloads never use Wi-Fi here (tap Net: Mobile to allow any network)."
                              changed()
                              sleepMs(2500)
                              continue
                          }
                          val failedUp = items.firstOrNull { it.status == "upload_failed" }
                          if (failedUp != null) {
                              blockReason = "Paused: the upload of " + failedUp.name + " failed. Open Downloads, tap it and choose Retry upload (or remove it). The remaining downloads continue after that."
                              changed()
                              sleepMs(3000)
                              continue
                          }
                          val free = freeBytes()
                          if (item.needed > 0 && handedCount() > 0 && free - item.needed < RESERVE) {
                              blockReason = "Waiting for space: the next file needs " + fmt(item.needed) + " but only " + fmt(maxOf(0L, free - RESERVE)) + " is usable. It continues after the current uploads finish and their files are deleted."
                              changed()
                              sleepMs(3000)
                              continue
                          }
                          if (free <= RESERVE) {
                              blockReason = "STOPPED: only " + fmt(free) + " free. Downloads are paused until more than 1 GB is free."
                              if (!lowWarned) {
                                  lowWarned = true
                                  warn("Storage is almost full: only " + fmt(free) + " is left. Downloads are stopped to keep 1 GB free. Free up space (or choose another folder) and they continue automatically.")
                              }
                              changed()
                              sleepMs(3000)
                              continue
                          }
                          lowWarned = false
                          blockReason = null
                          break
                      }
                      if (item.status != "queued") continue
                      runItem(item)
                  }
              }

              private fun runItem(item: DlItem) {
                  currentItem = item
                  item.status = "downloading"
                  item.detail = ""
                  item.done = 0L
                  item.total = -1L
                  item.cancel = false
                  save()
                  changed(true)
                  log("▶ " + item.name)
                  val saved = download(item)
                  if (saved != null) {
                      val lower = item.name.lowercase()
                      if (item.detail.startsWith("Saved as")) {
                          item.status = "done"
                      } else if (lower.endsWith(".zip") || isVideoName(item.name)) {
                          handToUploader(item, saved)
                      } else if (lower.endsWith(".rar") || lower.endsWith(".7z")) {
                          item.status = "done"
                          item.detail = "Saved. RAR / 7Z files are not extracted or uploaded."
                      } else {
                          item.status = "done"
                          item.detail = "Saved (not a video or ZIP, so it is not uploaded)."
                      }
                  }
                  when (item.status) {
                      "done" -> log("  ✔ saved: " + item.name + (if (item.detail.isNotEmpty()) " — " + item.detail else ""))
                      "failed" -> log("  ✖ failed: " + item.name + " — " + item.detail)
                      "canceled" -> log("  ■ canceled: " + item.name)
                  }
                  currentItem = null
                  save()
                  changed(true)
              }

              // ---------- download ----------
              private fun download(item: DlItem): Uri? {
                  var part: Uri? = null
                  var conn: HttpURLConnection? = null
                  try {
                      val t = tree() ?: throw Exception("No download folder selected")
                      val parent = DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t))
                      val c = open(item)
                      conn = c
                      val code = c.responseCode
                      if (code !in 200..299) throw Exception("Server answered HTTP " + code)
                      val len = c.contentLengthLong
                      item.total = len
                      val ctype = (c.contentType ?: "").substringBefore(';').trim().lowercase()
                      if (ctype.startsWith("text/html")) {
                          throw Exception("The link returned a web page, not a file. Sign in on the site first, or use the file's own download link.")
                      }
                      val cd = c.getHeaderField("Content-Disposition")
                      val ins = BufferedInputStream(c.inputStream, 1 shl 16)
                      ins.mark(64)
                      val head = ByteArray(32)
                      var hn = 0
                      while (hn < 32) {
                          val r = ins.read(head, hn, 32 - hn)
                          if (r < 0) break
                          hn += r
                      }
                      ins.reset()
                      val name = finalName(item, c.url.toString(), cd, ctype, head, hn)
                      item.name = name
                      item.mime = ctype
                      log("  " + name + (if (len > 0) " (" + fmt(len) + ")" else "") + " — saving to your folder")
                      item.needed = 0L
                      if (len > 0) {
                          val free = freeBytes()
                          if (free - len < RESERVE) {
                              item.needed = len
                              if (handedCount() > 0) throw DlWait()
                              throw DlSpace("Not enough space: this file needs " + fmt(len) + " but only " + fmt(maxOf(0L, free - RESERVE)) + " is usable (1 GB is always kept free).")
                          }
                      }
                      val resolver = app.contentResolver
                      val p = DocumentsContract.createDocument(resolver, parent, "application/octet-stream", name + ".part")
                          ?: throw Exception("Could not create a file in the chosen folder. Choose the folder again.")
                      part = p
                      item.partUri = p.toString()
                      save()
                      val out = resolver.openOutputStream(p, "w") ?: throw Exception("Could not open the file for writing")
                      ins.use { i2 ->
                          out.use { o -> copyChecked(item, i2, o) }
                      }
                      if (len > 0 && item.done != len) {
                          throw Exception("Connection ended early (got " + fmt(item.done) + " of " + fmt(len) + ")")
                      }
                      var renamed: Uri? = try { DocumentsContract.renameDocument(resolver, p, name) } catch (e: Exception) { null }
                      if (renamed == null) {
                          val stem = name.substringBeforeLast('.', name)
                          val ext = name.substringAfterLast('.', "")
                          val alt = stem + "_" + (System.currentTimeMillis() % 100000L) + (if (ext.isNotEmpty() && ext != name) "." + ext else "")
                          renamed = try { DocumentsContract.renameDocument(resolver, p, alt) } catch (e: Exception) { null }
                      }
                      item.partUri = ""
                      if (renamed == null) {
                          item.detail = "Saved as " + name + ".part (could not rename)"
                          part = null
                          item.doc = p.toString()
                          return p
                      }
                      part = null
                      val fixed = ensureName(renamed, displayName(renamed) ?: name, name)
                      item.name = displayName(fixed) ?: name
                      item.doc = fixed.toString()
                      return fixed
                  } catch (e: DlCancel) {
                      item.status = "canceled"
                      item.detail = "Canceled"
                      deleteQuiet(part)
                  } catch (e: DlWait) {
                      item.status = "queued"
                      item.detail = "Waiting for space"
                      deleteQuiet(part)
                      log("⏸ " + item.name + " needs " + fmt(item.needed) + " - waiting for the current uploads to finish and free space")
                  } catch (e: DlSpace) {
                      item.status = "failed"
                      item.detail = e.message ?: "Not enough space"
                      deleteQuiet(part)
                      warn(item.detail)
                  } catch (e: Throwable) {
                      item.status = "failed"
                      item.detail = e.message ?: e.toString()
                      deleteQuiet(part)
                  } finally {
                      try { conn?.disconnect() } catch (e: Exception) { }
                      item.partUri = ""
                  }
                  return null
              }

              private fun copyChecked(item: DlItem, ins: InputStream, out: OutputStream) {
                  val buf = ByteArray(128 * 1024)
                  var last = SystemClock.elapsedRealtime()
                  var lastLog = last
                  while (true) {
                      if (item.cancel) throw DlCancel()
                      val n = ins.read(buf)
                      if (n < 0) break
                      out.write(buf, 0, n)
                      item.done += n
                      val now = SystemClock.elapsedRealtime()
                      if (now - last > 1500) {
                          last = now
                          val free = freeBytes()
                          if (free <= RESERVE) {
                              throw DlSpace("Stopped: free space reached the 1 GB reserve (" + fmt(free) + " left). The unfinished file was removed.")
                          }
                          if (now - lastLog > 20000) {
                              lastLog = now
                              log("  downloading " + (if (item.total > 0) (item.done * 100 / item.total).toString() + "%" else fmt(item.done)) + " • " + fmt(free) + " free")
                          }
                          changed()
                      }
                  }
              }

              private fun open(item: DlItem): HttpURLConnection {
                  var u = item.url
                  var hops = 0
                  while (true) {
                      val url = URL(u)
                      val net = if (anyNet()) null else cell
                      if (!anyNet() && net == null) throw Exception("Mobile data is not available (downloads never use Wi-Fi here)")
                      val c = (if (net != null) net.openConnection(url) else url.openConnection()) as HttpURLConnection
                      c.instanceFollowRedirects = false
                      c.connectTimeout = 20000
                      c.readTimeout = 30000
                      c.setRequestProperty("User-Agent", if (item.ua.isBlank()) DEFAULT_UA else item.ua)
                      if (item.referer.isNotBlank()) c.setRequestProperty("Referer", item.referer)
                      val ck = try { CookieManager.getInstance().getCookie(u) ?: item.cookie } catch (e: Throwable) { item.cookie }
                      if (ck.isNotBlank()) c.setRequestProperty("Cookie", ck)
                      c.setRequestProperty("Accept-Encoding", "identity")
                      val code = c.responseCode
                      if (code == 301 || code == 302 || code == 303 || code == 307 || code == 308) {
                          val loc = c.getHeaderField("Location") ?: return c
                          c.disconnect()
                          u = URL(URL(u), loc).toString()
                          hops++
                          if (hops > 8) throw Exception("Too many redirects")
                          continue
                      }
                      return c
                  }
              }

              // ---------- real file names ----------
              private fun extOf(n: String): String = n.substringAfterLast('.', "").lowercase()
              private fun hasKnownExt(n: String): Boolean = n.contains('.') && knownExts.contains(extOf(n))
              fun isVideoName(n: String): Boolean = videoExts.contains(extOf(n))

              private fun nameFromDisposition(cd: String?): String? {
                  if (cd.isNullOrBlank()) return null
                  try {
                      Regex("filename\\*\\s*=\\s*[A-Za-z0-9-]*'[^']*'([^;]+)", RegexOption.IGNORE_CASE).find(cd)?.let { m ->
                          val v = Uri.decode(m.groupValues[1].trim().trim('"'))
                          if (v.isNotBlank()) return v
                      }
                      Regex("filename\\s*=\\s*\"?([^\";]+)\"?", RegexOption.IGNORE_CASE).find(cd)?.let { m ->
                          val v = Uri.decode(m.groupValues[1].trim())
                          if (v.isNotBlank()) return v
                      }
                  } catch (e: Exception) { }
                  return null
              }

              private fun mimeExt(mime: String): String {
                  return when (mime.substringBefore(';').trim().lowercase()) {
                      "video/mp4" -> ".mp4"
                      "video/webm" -> ".webm"
                      "video/quicktime" -> ".mov"
                      "video/x-matroska" -> ".mkv"
                      "video/x-msvideo" -> ".avi"
                      "video/x-flv" -> ".flv"
                      "video/3gpp" -> ".3gp"
                      "application/zip", "application/x-zip-compressed" -> ".zip"
                      "application/x-rar-compressed", "application/vnd.rar" -> ".rar"
                      "application/x-7z-compressed" -> ".7z"
                      "application/x-tar" -> ".tar"
                      else -> ""
                  }
              }

              private fun sniffExt(b: ByteArray, n: Int): String {
                  if (n < 4) return ""
                  fun u(i: Int): Int = b[i].toInt() and 0xFF
                  if (u(0) == 0x50 && u(1) == 0x4B && (u(2) == 0x03 || u(2) == 0x05)) return ".zip"
                  if (u(0) == 0x52 && u(1) == 0x61 && u(2) == 0x72 && u(3) == 0x21) return ".rar"
                  if (u(0) == 0x37 && u(1) == 0x7A && u(2) == 0xBC && u(3) == 0xAF) return ".7z"
                  if (u(0) == 0x1A && u(1) == 0x45 && u(2) == 0xDF && u(3) == 0xA3) return ".mkv"
                  if (n >= 12 && u(4) == 0x66 && u(5) == 0x74 && u(6) == 0x79 && u(7) == 0x70) return if (u(8) == 0x71 && u(9) == 0x74) ".mov" else ".mp4"
                  if (n >= 12 && u(0) == 0x52 && u(1) == 0x49 && u(2) == 0x46 && u(3) == 0x46 && u(8) == 0x41 && u(9) == 0x56 && u(10) == 0x49) return ".avi"
                  if (u(0) == 0x46 && u(1) == 0x4C && u(2) == 0x56) return ".flv"
                  if (u(0) == 0x30 && u(1) == 0x26 && u(2) == 0xB2 && u(3) == 0x75) return ".wmv"
                  if (u(0) == 0x1F && u(1) == 0x8B) return ".gz"
                  return ""
              }

              private fun safe(s: String): String {
                  val c = s.replace(Regex("[\\\\/:*?\"<>|]"), "_").trim().trim('.')
                  return (if (c.isEmpty()) "file" else c).take(150)
              }

              /** The real file name: server header, then the link, then the file's own first bytes. Never ".bin" for a video. */
              private fun finalName(item: DlItem, finalUrl: String, cd: String?, ctype: String, head: ByteArray, hn: Int): String {
                  val cands = ArrayList<String>()
                  nameFromDisposition(cd)?.let { cands.add(it) }
                  cands.add(item.name)
                  try { cands.add(Uri.decode(URL(finalUrl).path ?: "")) } catch (e: Exception) { }
                  val cleaned = cands.map { it.substringAfterLast('/').substringAfterLast('\\').trim() }.filter { it.isNotBlank() }
                  cleaned.firstOrNull { hasKnownExt(it) }?.let { return safe(it) }
                  val base = (cleaned.firstOrNull() ?: "download").replace(junkExtRx, "")
                  val sn = sniffExt(head, hn)
                  if (sn.isNotEmpty()) return safe(base + sn)
                  return safe(base + mimeExt(ctype))
              }

              private fun displayName(doc: Uri): String? {
                  return try {
                      app.contentResolver.query(doc, arrayOf(DocumentsContract.Document.COLUMN_DISPLAY_NAME), null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(0) else null
                      }
                  } catch (e: Exception) { null }
              }

              // Some providers add an extra extension when a file is created. Make sure the name is what we want.
              private fun ensureName(doc: Uri, have: String, want: String): Uri {
                  return try {
                      if (have != want) DocumentsContract.renameDocument(app.contentResolver, doc, want) ?: doc else doc
                  } catch (e: Exception) { doc }
              }

              // ---------- hand-off to the uploader ----------
              private fun mimeFor(name: String): String {
                  val l = name.lowercase()
                  if (l.endsWith(".zip")) return "application/zip"
                  return MimeTypeMap.getSingleton().getMimeTypeFromExtension(extOf(name)) ?: "video/*"
              }

              private fun handIntent(item: DlItem, uri: Uri): Intent {
                  val i = Intent(app, MainActivity::class.java)
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                  i.putExtra("rbu_download_uri", uri.toString())
                  i.putExtra("rbu_download_id", "download:" + item.key)
                  i.putExtra("rbu_download_name", item.name)
                  i.putExtra("rbu_download_mime", mimeFor(item.name))
                  i.putExtra("rbu_download_key", item.key)
                  return i
              }

              private fun handToUploader(item: DlItem, uri: Uri) {
                  item.status = "handed"
                  item.detail = ""
                  item.doc = uri.toString()
                  item.handedAt = SystemClock.elapsedRealtime()
                  item.warned = false
                  save()
                  log("  ⬆ sent to the uploader: " + item.name)
                  val m = MainActivity.instance
                  try {
                      if (m != null) {
                          m.acceptDownloadedFile("download:" + item.key, uri, item.name, mimeFor(item.name), item.key)
                          m.ensureShown()
                      } else {
                          app.startActivity(handIntent(item, uri))
                      }
                  } catch (e: Exception) {
                      log("⚠ Could not open the uploader: " + (e.message ?: "unknown error"))
                  }
                  changed(true)
              }

              fun retryUpload(item: DlItem) {
                  if (item.status != "upload_failed" && item.status != "handed") return
                  if (item.doc.isEmpty()) return
                  val uri = Uri.parse(item.doc)
                  item.status = "handed"
                  item.detail = ""
                  item.handedAt = SystemClock.elapsedRealtime()
                  item.warned = false
                  save()
                  log("⬆ retrying upload: " + item.name)
                  val m = MainActivity.instance
                  try {
                      if (m != null) {
                          m.retryDownloadedFile(item.key, uri, item.name, mimeFor(item.name))
                          m.ensureShown()
                      } else {
                          val i = handIntent(item, uri)
                          i.putExtra("rbu_retry_download_key", item.key)
                          app.startActivity(i)
                      }
                  } catch (e: Exception) {
                      log("⚠ Could not open the uploader: " + (e.message ?: "unknown error"))
                  }
                  changed(true)
                  startService()
              }

              /** If Android blocked the background launch, leave a "tap to upload" notification. */
              fun checkHanded() {
                  if (!inited) return
                  val now = SystemClock.elapsedRealtime()
                  for (it in items) {
                      val mm = MainActivity.instance
                      if (it.status == "handed" && !it.warned && it.doc.isNotEmpty() && (mm == null || !mm.isShown()) && now - it.handedAt > 45000L) {
                          it.warned = true
                          log("⚠ The uploader did not open for " + it.name + ". Tap the notification to open it.")
                          try {
                              channels()
                              val pi = PendingIntent.getActivity(app, 32, handIntent(it, Uri.parse(it.doc)), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                              val n = builder(CH_WARN)
                                  .setContentTitle("Tap to upload")
                                  .setContentText(it.name)
                                  .setSmallIcon(android.R.drawable.stat_sys_upload)
                                  .setAutoCancel(true)
                                  .setContentIntent(pi)
                                  .build()
                              app.getSystemService(NotificationManager::class.java).notify(ID_TAP, n)
                          } catch (e: Exception) { }
                      }
                  }
              }

              // Called by the uploader when Rumble has verified (or failed) a downloaded file.
              fun onUploadResult(key: String, result: String, detail: String) {
                  if (!inited) return
                  val it = items.firstOrNull { x -> x.key == key } ?: return
                  when (result) {
                      "uploaded" -> {
                          it.status = "uploaded"
                          it.detail = detail
                          log("✔ UPLOADED AND VERIFIED: " + it.name)
                          if (it.doc.isNotEmpty()) {
                              val gone = deleteQuiet(Uri.parse(it.doc))
                              log(if (gone) "   local copy deleted to free space" else "   local copy removed")
                          }
                      }
                      "failed" -> {
                          it.status = "upload_failed"
                          it.detail = detail
                          warn("Upload failed: " + it.name + (if (detail.isNotEmpty()) " - " + detail else "") + ". The file was kept in your folder. Open Downloads to retry.")
                      }
                      else -> {
                          it.status = "done"
                          it.detail = "The uploader skipped it (not a supported video/ZIP). File kept."
                          log("   uploader skipped: " + it.name)
                      }
                  }
                  save()
                  changed(true)
              }

              // Shows the uploader's log lines here while a downloaded file is being uploaded.
              fun mirror(m: String) {
                  if (!inited) return
                  if (items.none { it.status == "handed" }) return
                  val t = m.trim()
                  if (t.isNotEmpty()) log("   ⬆ " + t)
              }

              private fun deleteQuiet(u: Uri?): Boolean {
                  if (u == null) return false
                  return try { DocumentsContract.deleteDocument(app.contentResolver, u) } catch (e: Exception) { false }
              }
          }
