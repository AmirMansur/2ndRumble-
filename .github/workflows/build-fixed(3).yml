              // ---------- floating window ----------
              private fun toggleFloat() {
                  if (floating) dock(false) else startFloat()
              }
          
              private fun makeShield(lp: WindowManager.LayoutParams, wm: WindowManager, box: View): View {
                  val shield = View(this)
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var dragged = false
                  shield.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              startX = lp.x
                              startY = lp.y
                              dragged = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = ev.rawX - downX
                                                            val dy = ev.rawY - downY
                              if (!dragged && (Math.abs(dx) > dp(12) || Math.abs(dy) > dp(12))) dragged = true
                              if (dragged) {
                                  lp.x = startX + dx.toInt()
                                  lp.y = startY + dy.toInt()
                                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!dragged) floatTap() else snapToSide(lp, wm, box)
                          }
                      }
                      true
                  }
                  return shield
              }
          
              private fun floatTap() {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastFloatTap > 700) floatTaps = 0
                  lastFloatTap = now
                  floatTaps++
                  if (floatTaps >= 3) {
                      floatTaps = 0
                      h.post { dock(true) }
                  }
              }
          
              private fun startFloat(moveBack: Boolean = true, prompt: Boolean = true) {
                  if (floating) return
                  if (!canOverlay()) {
                      if (prompt) {
                          log("Allow 'Display over other apps' for this app on the screen that just opened, then tap Float again.")
                          try {
                              startActivity(Intent(android.provider.Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                          } catch (e: Exception) { }
                      }
                      return
                  }
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val dm = resources.displayMetrics
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val idx = root.indexOfChild(wv)
                  root.removeView(wv)
                  val ph = TextView(this)
                  ph.text = "Browser is floating as a small bubble.\nTriple-tap the bubble, or press Dock, to bring it back."
                  ph.setTextColor(Color.WHITE)
                  ph.gravity = Gravity.CENTER
                  root.addView(ph, if (idx < 0) root.childCount else idx, LinearLayout.LayoutParams(mp, 0, 4f))
                  placeholder = ph
          
                  // Bubble is tiny (like a screen-recorder pill), but the real WebView inside it
                  // is kept at a normal working size and just visually scaled down to fit -
                  // Android still treats it as a fully live, attached, non-zero-size view.
                  val bubbleDp = 52
                  val bubblePx = dp(bubbleDp)
                  val innerDp = 360
                  val innerPx = dp(innerDp)
                  val innerH = dp(640)
                  val scale = bubblePx.toFloat() / innerPx.toFloat()
          
                  val box = FrameLayout(this)
                  box.clipChildren = true
                  box.clipToOutline = true
                  box.background = android.graphics.drawable.GradientDrawable().apply {
                      shape = android.graphics.drawable.GradientDrawable.OVAL
                      setColor(Color.parseColor("#9FE870"))
                      setStroke(dp(2), Color.parseColor("#1b5e20"))
                  }
                  box.addView(wv, FrameLayout.LayoutParams(innerPx, innerH))
                  wv.pivotX = 0f
                  wv.pivotY = 0f
                  wv.scaleX = scale
                  wv.scaleY = scale
          
                  val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  val lp = WindowManager.LayoutParams(
                      bubblePx, bubblePx,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val margin = dp(4)
                  val savedX = prefs.getInt("bx", dm.widthPixels - bubblePx - margin)
                  lp.x = if (savedX + bubblePx / 2 < dm.widthPixels / 2) margin else dm.widthPixels - bubblePx - margin
                  lp.y = prefs.getInt("by", (dm.heightPixels * 0.30f).toInt()).coerceIn(dp(40), dm.heightPixels - bubblePx - dp(90))
                  box.addView(makeShield(lp, wm, box), FrameLayout.LayoutParams(mp, mp))
                  wm.addView(box, lp)
                  floatBox = box
                  floating = true
                  floatBtn?.text = "Dock"
                  if (prompt) log("Floating as a small bubble at the side. Drag it to move it; triple-tap it to open the app.")
                  if (moveBack) h.postDelayed({ moveTaskToBack(true) }, 400)
              }
          
              private fun dock(openApp: Boolean) {
                  if (!floating) return
                  if (openApp) {
                      try {
                          val i = Intent(this, MainActivity::class.java)
                          i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(i)
                      } catch (e: Exception) { }
                  }
                  val box = floatBox
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try { if (box != null) wm.removeView(box) } catch (e: Exception) { }
                  try { box?.removeView(wv) } catch (e: Exception) { }
                  wv.scaleX = 1f
                  wv.scaleY = 1f
                  wv.pivotX = (wv.width / 2).toFloat()
                  wv.pivotY = (wv.height / 2).toFloat()
                  var idx = root.childCount
                  val ph = placeholder
                  if (ph != null) {
                      idx = root.indexOfChild(ph)
                      root.removeView(ph)
                  }
                  if (idx < 0) idx = root.childCount
                  if (wv.parent == null) root.addView(wv, idx, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 4f))
                  floatBox = null
                  placeholder = null
                  floating = false
                  floatBtn?.text = "Float"
              }
          
              // ---------- auto-revive / background ----------
              private fun canOverlay(): Boolean = android.provider.Settings.canDrawOverlays(this)
          
              private fun handleAuto(i: Intent?) {
                  if (i == null || !i.getBooleanExtra("auto", false)) return
                  autoBoot = true
                  try { root.visibility = View.INVISIBLE } catch (e: Exception) { }
                  if (running) {
                      h.postDelayed({ finishAuto() }, 800)
                  } else if (queue.isNotEmpty()) {
                      wantResume = prefs.getBoolean("run_wanted", false)
                      maybeResume()
                      if (!running) h.postDelayed({ if (autoBoot && !zipLoading) finishAuto() }, 8000)
                  }
              }
          
              private fun maybeResume() {
                  if (wantResume && !running && queue.isNotEmpty()) {
                      wantResume = false
                      log("Resuming the run that was interrupted...")
                      startRun(autoBoot)
                      if (autoBoot) h.postDelayed({ finishAuto() }, 1500)
                  }
              }
          
              private fun finishAuto() {
                  if (!autoBoot) return
                  autoBoot = false
                  if (running && canOverlay()) startFloat(true, false) else moveTaskToBack(true)
              }
          
              fun stopFromNotification() {
                  stopRun("Stopped from the notification.")
              }
          
              private fun snapToSide(lp: WindowManager.LayoutParams, wm: WindowManager, box: View) {
                  val dm = resources.displayMetrics
                  val size = lp.width
                  val margin = dp(4)
                  lp.x = if (lp.x + size / 2 < dm.widthPixels / 2) margin else dm.widthPixels - size - margin
                  val minY = dp(40)
                  val maxY = dm.heightPixels - size - dp(90)
                  if (lp.y < minY) lp.y = minY
                  if (lp.y > maxY) lp.y = maxY
                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                  prefs.edit().putInt("bx", lp.x).putInt("by", lp.y).apply()
              }
          
              private fun watchdogOn(): Boolean {
                  val v = android.provider.Settings.Secure.getString(contentResolver, android.provider.Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return v.contains("com.rbu.uploader") && v.contains("WatchdogService")
              }
          
              private fun setupWatchdog() {
                  val on = watchdogOn()
                  val msg = if (on) {
                      "The watchdog is ON.\n\nEvery time you open an app it checks the uploader. If the uploader was killed it comes back by itself, continues with the next video and shows the side bubble again.\n\nTo stop the uploader for real, press Stop (or Stop in the notification)."
                  } else {
                      "The watchdog is OFF.\n\n1) Tap 'Open settings'.\n2) Find 'Rumble Batch Uploader' and turn it ON. If the switch is greyed out, tap it once, then go to Settings > Apps > Rumble Batch Uploader > three dots (top right) > 'Allow restricted settings', and try again.\n\nIt only notices which app opens. It does not read your screen."
                  }
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Auto-revive watchdog")
                      .setMessage(msg)
                      .setPositiveButton("Open settings") { _, _ ->
                          try { startActivity(Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS)) } catch (e: Exception) { }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }
          
              // ---------- folder ----------
              private fun pickFolder() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_TREE)
              }
          
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_TREE && resultCode == RESULT_OK) {
                      val u = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      } catch (e: Exception) { }
                      prefs.edit().putString("tree", u.toString()).remove("zips").apply()
                      try { loadVideos(u) } catch (e: Exception) { log("Could not read folder: " + e.message) }
                      updateStatus()
                  }
                  if (requestCode == REQ_ZIP && resultCode == RESULT_OK) {
                      val list = ArrayList<Uri>()
                      data?.data?.let { list.add(it) }
                      val cd = data?.clipData
                      if (cd != null) { for (k in 0 until cd.itemCount) { cd.getItemAt(k).uri?.let { if (!list.contains(it)) list.add(it) } } }
                      if (list.isEmpty()) return
                      for (u in list) {
                          try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (e: Exception) { }
                      }
                      prefs.edit().putStringSet("zips", list.map { it.toString() }.toSet()).remove("tree").apply()
                      loadZips(list)
                  }
              }
          
              // ---------- ZIP support ----------
              private fun pickZip() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/zip", "application/x-zip-compressed", "application/x-zip", "application/octet-stream"))
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  startActivityForResult(i, REQ_ZIP)
              }
          
              private fun loadZips(uris: List<Uri>, append: Boolean = false, autoStart: Boolean = false, sourceDownloadKey: String? = null) {
                  log("Reading " + uris.size + " ZIP file(s)... big files can take a minute.")
                  zipLoading = true
                  Thread {
                      val list = ArrayList<Vid>()
                      var err: String? = null
                      for (zu in uris) {
                          try {
                              val ins = contentResolver.openInputStream(zu) ?: throw Exception("cannot open ZIP")
                              ins.use { raw ->
                                  java.util.zip.ZipInputStream(java.io.BufferedInputStream(raw, 1 shl 16)).use { zis ->
                                      var e = zis.nextEntry
                                      while (e != null) {
                                          val en = e.name
                                          val base = en.substringAfterLast('/')
                                          if (!e.isDirectory && !en.startsWith("__MACOSX/") && !base.startsWith("._") && base.lowercase().matches(videoExt)) {
                                              list.add(Vid("zip:" + zu.toString() + "#" + en, base, zu, zu, en, sourceDownloadKey))
                                          }
                                          e = zis.nextEntry
                                      }
                                  }
                              }
                          } catch (ex: Exception) { err = ex.message ?: ex.toString() }
                      }
                      runOnUiThread {
                          queue = (if (append) queue else emptyList()).plus(list).distinctBy { it.id }.sortedWith(natCmp)
                          if (!append) failed.clear()
                          if (err != null) log("ZIP problem: " + err)
                          log("ZIP loaded: " + list.size + " video(s). Total queue: " + queue.size)
                          zipLoading = false
                          updateStatus()
                          if (sourceDownloadKey != null && list.isEmpty()) notifyDownloadPipeline(sourceDownloadKey, "skipped")
                          if (autoStart && list.isNotEmpty() && !running) startRun(auto = true) else maybeResume()
                      }
                  }.start()
              }
          
              private fun extractDir(): java.io.File {
                  val d = java.io.File(cacheDir, "zipx")
                  d.mkdirs()
                  return d
              }
          
              private fun cleanupTemp() {
                  synchronized(lock) {
                      extractGen++
                      val f = extractFile
                      extractFile = null
                      extractErr = null
                      extractDone = true
                      if (f != null) {
                          try { f.delete() } catch (e: Exception) { }
                          try { f.parentFile?.delete() } catch (e: Exception) { }
                      }
                  }
              }
          
              private fun startExtract(v: Vid) {
                  val g = synchronized(lock) {
                      extractGen++
                      extractDone = false
                      extractErr = null
                      extractFile = null
                      extractGen
                  }
                  Thread {
                      var dir: java.io.File? = null
                      var out: java.io.File? = null
                      var err: String? = null
                      try {
                          val zu = v.zip ?: throw Exception("no zip")
                          val want = v.entry ?: throw Exception("no entry")
                          val d = java.io.File(extractDir(), "d" + System.currentTimeMillis())
                          d.mkdirs()
                          dir = d
                          val o = java.io.File(d, v.name.replace(Regex("[^A-Za-z0-9._ ()\\[\\]-]"), "_"))
                          out = o
                          val ins = contentResolver.openInputStream(zu) ?: throw Exception("cannot open ZIP")
                          var found = false
                          ins.use { raw ->
                              java.util.zip.ZipInputStream(java.io.BufferedInputStream(raw, 1 shl 16)).use { zis ->
                                  var e = zis.nextEntry
                                  while (e != null) {
                                      if (e.name == want) {
                                          java.io.FileOutputStream(o).use { fo -> zis.copyTo(fo, 1 shl 16) }
                                          found = true
                                          break
                                      }
                                      e = zis.nextEntry
                                  }
                              }
                          }
                          if (!found) throw Exception("video not found inside the ZIP")
                      } catch (ex: Throwable) {
                          err = ex.message ?: ex.toString()
                      }
                      synchronized(lock) {
                          if (g == extractGen) {
                              if (err == null) extractFile = out else {
                                  extractErr = err
                                  try { out?.delete() } catch (e: Exception) { }
                                  try { dir?.delete() } catch (e: Exception) { }
                              }
                              extractDone = true
                          } else {
                              try { out?.delete() } catch (e: Exception) { }
                              try { dir?.delete() } catch (e: Exception) { }
                          }
                      }
                  }.start()
              }
          
              // ---------- downloaded files hand-off ----------
              private fun deleteUri(u: Uri): Boolean {
                  return try {
                      if (android.provider.DocumentsContract.isDocumentUri(this, u)) android.provider.DocumentsContract.deleteDocument(contentResolver, u)
                      else contentResolver.delete(u, null, null) > 0
                  } catch (e: Exception) { false }
              }

              fun isShown(): Boolean = visible || floating

              // The Rumble page must be visible (or floating) to work: a stopped WebView cannot open the file chooser.
              fun ensureShown() {
                  runOnUiThread {
                      if (visible || floating || autoBoot) return@runOnUiThread
                      if (canOverlay()) {
                          try { startFloat(false, false) } catch (e: Exception) { }
                      } else {
                          log("Tip: tap Float once and allow 'Display over other apps', so uploads can run in a bubble while you browse. For now the uploader is brought to the front.")
                          try {
                              val i = Intent(this, MainActivity::class.java)
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                              startActivity(i)
                          } catch (e: Exception) { }
                      }
                  }
              }

              private fun handleDownloadedIntent(i: Intent?) {
                  if (i == null || !i.hasExtra("rbu_download_uri")) return
                  val uri = try { Uri.parse(i.getStringExtra("rbu_download_uri") ?: return) } catch (e: Exception) { return }
                  val id = i.getStringExtra("rbu_download_id") ?: ("download:" + uri.toString())
                  val name = i.getStringExtra("rbu_download_name") ?: "downloaded-video"
                  val mime = i.getStringExtra("rbu_download_mime") ?: ""
                  val downloadKey = i.getStringExtra("rbu_download_key")
                  i.removeExtra("rbu_download_uri")
                  acceptDownloadedFile(id, uri, name, mime, downloadKey)
              }
          
              private fun handleRetryDownloadedIntent(i: Intent?) {
                  val key = i?.getStringExtra("rbu_retry_download_key") ?: return
                  val uriText = i.getStringExtra("rbu_download_uri")
                  val name = i.getStringExtra("rbu_download_name") ?: "downloaded-video"
                  val mime = i.getStringExtra("rbu_download_mime") ?: ""
                  i.removeExtra("rbu_retry_download_key")
                  if (uriText != null) {
                      try { acceptDownloadedFile("download:" + key, Uri.parse(uriText), name, mime, key) }
                      catch (e: Exception) { log("Could not restore failed download for retry: ${e.message}") }
                  } else {
                      retryDownloadedFile(key)
                  }
              }
          
              fun retryDownloadedFile(downloadKey: String, downloadedUri: Uri? = null, name: String = "downloaded-video", mime: String = "") {
                  runOnUiThread {
                      val targets = queue.filter { it.sourceDownloadKey == downloadKey && !isDone(it.id) }
                      if (targets.isEmpty()) {
                          if (downloadedUri != null) {
                              acceptDownloadedFile("download:" + downloadKey, downloadedUri, name, mime, downloadKey)
                          } else {
                              log("No pending video found for this failed download. Reopen the downloaded file and retry.")
                          }
                          return@runOnUiThread
                      }
                      targets.forEach { failed.remove(it.id) }
                      cur = null
                      pendingUri = null
                      busy = false
                      state = S.IDLE
                      log("Retrying failed upload: ${targets.size} remaining video(s). Original downloaded file is retained.")
                      if (!running) startRun(auto = true)
                  }
              }
          
              fun acceptDownloadedFile(id: String, uri: Uri, name: String, mime: String, downloadKey: String? = null) {
                  runOnUiThread {
                      val lower = name.lowercase()
                      val isZip = lower.endsWith(".zip") || mime.equals("application/zip", true) || mime.equals("application/x-zip-compressed", true)
                      if (isZip) {
                          log("Download ready: $name — scanning ZIP contents")
                          loadZips(listOf(uri), append = true, autoStart = true, sourceDownloadKey = downloadKey)
                      } else if (mime.startsWith("video/") || lower.matches(videoExt)) {
                          val stableId = if (id.startsWith("download:")) id else "download:" + id
                          if (queue.none { it.id == stableId } && !isDone(stableId)) {
                              queue = (queue + Vid(stableId, name, uri, sourceDownloadKey = downloadKey)).sortedWith(natCmp)
                              log("Download ready: $name — added to upload queue")
                          } else {
                              log("Already queued/completed: $name")
                          }
                          updateStatus()
                          if (!running && queue.any { !isDone(it.id) && !failed.contains(it.id) }) startRun(auto = true)
                      } else {
                          if (lower.endsWith(".rar") || lower.endsWith(".7z") || lower.endsWith(".tar") || lower.endsWith(".gz") || lower.endsWith(".tgz")) {
                              log("Archive detected: $name. This build extracts ZIP files; this archive format is retained but not extracted.")
                          } else {
                              log("Downloaded but not uploaded (unsupported/non-video type): $name [$mime]")
                          }
                          downloadKey?.let { notifyDownloadPipeline(it, "skipped") }
                      }
                  }
              }
          
              private fun notifyDownloadPipeline(key: String, result: String, detail: String? = null) {
                  try { DlEngine.onUploadResult(key, result, detail ?: "") } catch (e: Exception) { }
                  val edit = prefs.edit()
                  if (result == "failed") {
                      edit.putString("dl_upload_fail_key", key)
                          .putString("dl_upload_fail_detail", detail ?: "Upload failed")
                          .putBoolean("dl_auto_pipeline", false)
                          .putBoolean("dl_paused", true)
                  } else if (result == "uploaded") {
                      edit.remove("dl_upload_fail_key").remove("dl_upload_fail_detail")
                  }
                  edit.apply()
                  sendBroadcast(Intent("com.rbu.uploader.DOWNLOAD_UPLOAD_RESULT")
                      .setPackage(packageName)
                      .putExtra("download_key", key)
                      .putExtra("result", result)
                      .putExtra("detail", detail ?: ""))
              }
          
              // ---------- accounts ----------
              private fun acctNames(): List<String> =
                  (prefs.getStringSet("accts", emptySet()) ?: emptySet()).toList().sortedBy { it.lowercase() }
          
              private fun snapshotCookies(): String {
                  val cm = CookieManager.getInstance()
                  cm.flush()
                  return cm.getCookie("https://rumble.com") ?: ""
              }
          
              private fun saveCookiesFor(name: String) {
                  val c = snapshotCookies()
                  if (c.isNotEmpty()) prefs.edit().putString("ck_" + name, c).apply()
              }
          
              private fun applyCookies(c: String) {
                  val cm = CookieManager.getInstance()
                  for (part in c.split(";")) {
                      val p = part.trim()
                      if (p.isEmpty() || !p.contains("=")) continue
                      cm.setCookie("https://rumble.com", p + "; Domain=rumble.com; Path=/; Secure; Max-Age=31536000")
                  }
                  cm.flush()
              }
          
              private fun clearSession(after: () -> Unit) {
                  val cm = CookieManager.getInstance()
                  cm.removeAllCookies {
                      try { android.webkit.WebStorage.getInstance().deleteAllData() } catch (e: Exception) { }
                      cm.flush()
                      after()
                  }
              }
          
              private fun showAccounts() {
                  val names = acctNames()
                  val items = ArrayList<String>()
                  for (n in names) items.add((if (n == acct) "(current) " else "") + n)
                  items.add("+ Save current login...")
                  items.add("+ Log in to another account")
                  if (names.isNotEmpty()) items.add("- Remove an account...")
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Rumble accounts" + (if (acct.isEmpty()) "" else " (now: $acct)"))
                      .setItems(items.toTypedArray()) { _, which ->
                          when {
                              which < names.size -> switchTo(names[which])
                              which == names.size -> saveCurrentAs()
                              which == names.size + 1 -> newLogin()
                              else -> removeAccount()
                          }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }
          
              private fun switchTo(name: String) {
                  if (running) { log("Stop the run first, then switch accounts."); return }
                  if (name == acct) { log("Already on account: $name"); return }
                  val c = prefs.getString("ck_" + name, null)
                  if (c.isNullOrEmpty()) { log("No saved login for '$name'. Log in, then Accounts > Save current login."); return }
                  if (acct.isNotEmpty()) saveCookiesFor(acct)
                  clearSession {
                      applyCookies(c)
                      acct = name
                      prefs.edit().putString("acct", name).apply()
                      failed.clear()
                      wv.loadUrl(UPLOAD_URL)
                      log("Switched to account: $name")
                      updateStatus()
                  }
              }
          
              private fun newLogin() {
                  if (running) { log("Stop the run first, then switch accounts."); return }
                  if (acct.isNotEmpty()) saveCookiesFor(acct) else log("Note: your current login was not saved, so it will be signed out.")
                  clearSession {
                      acct = ""
                      prefs.edit().putString("acct", "").apply()
                      failed.clear()
                      wv.loadUrl(UPLOAD_URL)
                      log("Signed out of the browser. Log in to the other Rumble account above, then tap Accounts > Save current login.")
                      updateStatus()
                  }
              }
          
              private fun saveCurrentAs() {
                  val c = snapshotCookies()
                  if (c.isEmpty()) { log("No login found yet. Log in to Rumble first."); return }
                  val et = android.widget.EditText(this)
                  et.hint = "Account name (e.g. Main, Shop)"
                  et.setText(acct)
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Save current login as")
                      .setView(et)
                      .setPositiveButton("Save") { _, _ ->
                          val name = et.text.toString().trim().replace(Regex("[^A-Za-z0-9 _.-]"), "")
                          if (name.isEmpty()) {
                              log("Name can't be empty.")
                          } else {
                              val names = HashSet<String>(prefs.getStringSet("accts", emptySet()) ?: emptySet())
                              names.add(name)
                              val ed = prefs.edit()
                              ed.putStringSet("accts", names)
                              ed.putString("ck_" + name, c)
                              if (acct.isEmpty()) {
                                  val d = prefs.getStringSet("done", null)
                                  if (d != null && !prefs.contains("done_" + name)) ed.putStringSet("done_" + name, HashSet<String>(d))
                                  ed.remove("done")
                              }
                              ed.putString("acct", name)
                              ed.apply()
                              acct = name
                              log("Saved login as '$name'.")
                              updateStatus()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }
          
              private fun removeAccount() {
                  val names = acctNames()
                  if (names.isEmpty()) return
                  android.app.AlertDialog.Builder(this)
                      .setTitle("Remove which account?")
                      .setItems(names.toTypedArray()) { _, which ->
                          val n = names[which]
                          val set = HashSet<String>(prefs.getStringSet("accts", emptySet()) ?: emptySet())
                          set.remove(n)
                          prefs.edit().putStringSet("accts", set).remove("ck_" + n).remove("done_" + n).apply()
                          if (n == acct) { acct = ""; prefs.edit().putString("acct", "").apply() }
                          log("Removed account '$n' (its saved login and progress).")
                          updateStatus()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }
          
              private fun cleanTitle(raw: String): String {
                  var t = raw
                  // drop (...), {...} and [...] segments, including nested ones
                  repeat(5) {
                      t = t.replace(Regex("\\([^()]*\\)"), " ")
                      t = t.replace(Regex("\\{[^{}]*\\}"), " ")
                      t = t.replace(Regex("\\[[^\\[\\]]*\\]"), " ")
                  }
                  return t.replace(Regex("\\s{2,}"), " ").trim()
              }
          
              private fun natKey(s: String): List<String> =
                  Regex("\\d+|\\D+").findAll(s.lowercase()).map { it.value }.toList()
          
              private val natCmp = Comparator<Vid> { a, b ->
                  val x = natKey(a.name)
                  val y = natKey(b.name)
                  var res = 0
                  var i = 0
                  while (res == 0 && i < minOf(x.size, y.size)) {
                      val p = x[i]
                      val q = y[i]
                      res = if (p[0].isDigit() && q[0].isDigit()) p.toBigInteger().compareTo(q.toBigInteger()) else p.compareTo(q)
                      i++
                  }
                  if (res != 0) res else x.size - y.size
              }
          
              private fun loadVideos(tree: Uri) {
                  val treeId = DocumentsContract.getTreeDocumentId(tree)
                  val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeId)
                  val list = ArrayList<Vid>()
                  val ext = Regex(".*\\.(mp4|mov|mkv|avi|webm|m4v|3gp|flv|wmv|mpg|mpeg|ogv|ts|mts|m2ts|asf)")
                  val cur = contentResolver.query(
                      children,
                      arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      ), null, null, null
                  )
                  cur?.use {
                      while (it.moveToNext()) {
                          val id = it.getString(0)
                          val name = it.getString(1) ?: continue
                          val mime = it.getString(2) ?: ""
                          if (mime.startsWith("video/") || name.lowercase().matches(ext)) {
                              list.add(Vid(id, name, DocumentsContract.buildDocumentUriUsingTree(tree, id)))
                          }
                      }
                  }
                  queue = list.sortedWith(natCmp)
                  failed.clear()
                  log("Folder loaded: ${queue.size} video(s).")
              }
          
              // ---------- upload network usage ----------
              private fun currentUidTxBytes(): Long {
                  val value = try { TrafficStats.getUidTxBytes(Process.myUid()) } catch (_: Exception) { TrafficStats.UNSUPPORTED.toLong() }
                  return if (value < 0L) -1L else value
              }
          
              private fun updateUploadTrafficLive() {
                  val baseline = uploadTrafficBaseline
                  if (baseline < 0L) return
                  val now = currentUidTxBytes()
                  if (now < baseline) return
                  prefs.edit().putLong("upload_tx_current", now - baseline).apply()
              }
          
              private fun finishUploadTraffic() {
                  val baseline = uploadTrafficBaseline
                  if (baseline >= 0L) {
                      val now = currentUidTxBytes()
                      if (now >= baseline) {
                          val delta = now - baseline
                          val total = prefs.getLong("upload_tx_total", 0L) + delta
                          prefs.edit().putLong("upload_tx_total", total).putLong("upload_tx_current", 0L).apply()
                      }
                  }
                  uploadTrafficBaseline = -1L
              }
          
              private fun formatTrafficBytes(bytes: Long): String {
                  if (bytes < 0L) return "Unavailable"
                  val mb = bytes / (1024.0 * 1024.0)
                  return if (mb >= 1024.0) String.format(java.util.Locale.US, "%.2f GB", mb / 1024.0)
                  else String.format(java.util.Locale.US, "%.1f MB", mb)
              }
          
              // ---------- progress ----------
              private fun doneKey() = if (acct.isEmpty()) "done" else "done_" + acct
              private fun doneSet(): Set<String> = prefs.getStringSet(doneKey(), emptySet()) ?: emptySet()
              private fun isDone(id: String) = doneSet().contains(id)
              private fun doneCount() = queue.count { isDone(it.id) }
          
              private fun markDone(note: String) {
                  finishUploadTraffic()
                  val n = HashSet<String>(doneSet())
                  cur?.let { n.add(it.id) }
                  prefs.edit().putStringSet(doneKey(), n).apply()
                  // Notify the download queue only when this direct file or every video in its ZIP is verified.
                  val completed = cur
                  if (completed?.sourceDownloadKey != null) {
                      val key = completed.sourceDownloadKey
                      if (completed.zip == null) {
                          val completedKeys = HashSet(prefs.getStringSet("dl_uploaded_keys", emptySet()) ?: emptySet())
                          completedKeys.add(key)
                          prefs.edit().putStringSet("dl_uploaded_keys", completedKeys).apply()
                          notifyDownloadPipeline(key, "uploaded")
                      } else {
                          val allEntriesDone = queue.filter { it.zip == completed.zip }.all { n.contains(it.id) }
                          if (allEntriesDone) {
                              val completedKeys = HashSet(prefs.getStringSet("dl_uploaded_keys", emptySet()) ?: emptySet())
                              completedKeys.add(key)
                              prefs.edit().putStringSet("dl_uploaded_keys", completedKeys).apply()
                              notifyDownloadPipeline(key, "uploaded")
                          }
                      }
                  }
                  // Delete app-downloaded source files only after successful verification.
                  try {
                      if (completed != null) {
                          if (completed.zip != null) {
                              val allEntriesDone = queue.filter { it.zip == completed.zip }.all { n.contains(it.id) }
                              if (allEntriesDone && !deleteUri(completed.zip)) log("  cleanup deferred: could not delete the ZIP")
                          } else if (completed.id.startsWith("download:")) {
                              if (!deleteUri(completed.uri)) log("  cleanup deferred: could not delete the local file")
                          }
                      }
                  } catch (e: Exception) { log("  cleanup deferred: " + (e.message ?: "permission unavailable")) }
                  log("  ✔ done$note")
                  prefs.edit().putInt("revive_n", 0).apply()
                  state = S.IDLE
                  updateStatus()
              }
          
              private fun resetProgress() {
                  prefs.edit().remove(doneKey()).apply()
                  failed.clear()
                  log("Progress reset: all videos will be uploaded again.")
                  updateStatus()
              }
          
              private fun updateStatus() {
                  val sent = prefs.getLong("upload_tx_total", 0L) + prefs.getLong("upload_tx_current", 0L)
                  val current = prefs.getLong("upload_tx_current", 0L)
                  val trafficLabel = if (prefs.getBoolean("upload_tx_supported", true)) formatTrafficBytes(sent) else "Unavailable on this device"
                  val currentLabel = if (prefs.getBoolean("upload_tx_supported", true)) formatTrafficBytes(current) else "Unavailable"
                  statusView.text = "Videos: ${queue.size}  •  done: ${doneCount()}  •  " + (if (running) "RUNNING" else "stopped") + (if (acct.isEmpty()) "" else "  •  " + acct) + "  •  watchdog " + (if (watchdogOn()) "ON" else "OFF") + "\nUpload data this video (estimated): " + currentLabel + "\nTotal upload data used (estimated): " + trafficLabel
                  notifyProgress()
              }
          
              private fun notifyProgress() {
                  if (!running) return
                  val n = queue.size
                  val d = doneCount()
                  val name = cur?.name ?: ""
                  Notifier.update(applicationContext, "Uploading " + minOf(d + 1, n) + "/" + n + (if (name.isNotEmpty()) " - " + name else ""))
              }
          
              private fun log(m: String) {
                  logView.append(m + "\n")
                  if (logView.length() > 30000) logView.text = logView.text.toString().takeLast(20000)
                  logScroll.post { logScroll.fullScroll(android.view.View.FOCUS_DOWN) }
                  try { DlEngine.mirror(m) } catch (e: Exception) { }
              }
          
              // ---------- network separation: cellular downloads / Wi-Fi uploads ----------
              private fun requestWiFiForUpload(auto: Boolean) {
                  if (waitingForUploadWifi) {
                      log("Waiting for Wi-Fi. Uploads will not use mobile data.")
                      return
                  }
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  waitingForUploadWifi = true
                  uploadWifiReady = false
                  log("Waiting for Wi-Fi before uploading. Mobile data will not be used for Rumble uploads.")
                  val request = NetworkRequest.Builder()
                      .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                      .addCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      .build()
                  val callback = object : ConnectivityManager.NetworkCallback() {
                      override fun onAvailable(network: Network) {
                          try {
                              val bound = if (Build.VERSION.SDK_INT >= 23) cm.bindProcessToNetwork(network) else false
                              runOnUiThread {
                                  uploadWifiNetwork = network
                                  uploadWifiReady = bound
                                  waitingForUploadWifi = false
                                  if (bound) {
                                      log("Wi-Fi connected. Rumble uploads are restricted to Wi-Fi.")
                                      startRun(auto)
                                  } else {
                                      log("Could not bind uploads to Wi-Fi. Upload has not started.")
                                      releaseUploadNetwork()
                                  }
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  waitingForUploadWifi = false
                                  uploadWifiReady = false
                                  log("Wi-Fi setup failed: ${e.message}. Upload has not started.")
                                  releaseUploadNetwork()
                              }
                          }
                      }
          
                      override fun onLost(network: Network) {
                          if (network == uploadWifiNetwork) {
                              runOnUiThread {
                                  uploadWifiReady = false
                                  uploadWifiNetwork = null
                                  if (running) stopRun("Wi-Fi disconnected. Upload stopped; it will not switch to mobile data. Reconnect Wi-Fi and press Start to retry.")
                              }
                          }
                      }
          
                      override fun onUnavailable() {
                          runOnUiThread {
                              waitingForUploadWifi = false
                              uploadWifiReady = false
                              log("No Wi-Fi network is available. Upload queue is waiting; mobile data will not be used.")
                              releaseUploadNetwork()
                          }
                      }
                  }
                  uploadWifiCallback = callback
                  try {
                      if (Build.VERSION.SDK_INT >= 26) cm.requestNetwork(request, callback, 60_000)
                      else cm.requestNetwork(request, callback)
                  } catch (e: Exception) {
                      waitingForUploadWifi = false
                      uploadWifiReady = false
                      log("Could not request Wi-Fi: ${e.message}")
                      releaseUploadNetwork()
                  }
              }
          
              private fun releaseUploadNetwork() {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  try { uploadWifiCallback?.let { cm.unregisterNetworkCallback(it) } } catch (_: Exception) { }
                  uploadWifiCallback = null
                  try { if (Build.VERSION.SDK_INT >= 23) cm.bindProcessToNetwork(null) } catch (_: Exception) { }
                  uploadWifiReady = false
                  waitingForUploadWifi = false
                  uploadWifiNetwork = null
              }
          
              // ---------- run control ----------
              private fun startRun(auto: Boolean = false) {
                  if (running) return
                  if (queue.isEmpty()) { log("Select a folder or ZIP with videos first."); return }
                  // Never start the Rumble WebView uploader until an actual Wi-Fi network
                  // is available and bound to this app process. No cellular fallback.
                  if (!uploadWifiReady) {
                      requestWiFiForUpload(auto)
                      return
                  }
                  if (!auto) {
                      if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                      }
                      try {
                          val pmc = getSystemService(Context.POWER_SERVICE) as PowerManager
                          if (!pmc.isIgnoringBatteryOptimizations(packageName)) {
                              val i = Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                              i.data = Uri.parse("package:$packageName")
                              startActivity(i)
                              log("Allow 'unrestricted battery use' on the screen that just opened, then tap Start again.")
                              return
                          }
                      } catch (e: Exception) { }
                      prefs.edit().putInt("revive_n", 0).apply()
                  }
                  running = true
                  isRunning = true
                  lastBeat = SystemClock.elapsedRealtime()
                  busy = false
                  state = S.IDLE
                  prefs.edit().putBoolean("run_wanted", true).apply()
                  Notifier.cancelResume(applicationContext)
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rbu:run")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
                  try {
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      val mode = if (Build.VERSION.SDK_INT >= 29) WifiManager.WIFI_MODE_FULL_LOW_LATENCY else WifiManager.WIFI_MODE_FULL_HIGH_PERF
                      val wl = wm.createWifiLock(mode, "rbu:wifi")
                      wl.setReferenceCounted(false)
                      wl.acquire()
                      wifiLock = wl
                  } catch (e: Exception) { }
                  try {
                      val svc = Intent(this, RbuService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc) else startService(svc)
                  } catch (e: Exception) { }
                  if (!auto && !canOverlay()) log("Tip: tap Float once and allow 'Display over other apps', so the uploader keeps a small bubble while you use other apps.")
                  updateStatus()
                  if (!visible && !floating && canOverlay()) { try { startFloat(false, false) } catch (e: Exception) { } }
                  h.post(ticker)
              }
          
              private fun stopRun(msg: String) {
                  // If an automatically downloaded file is interrupted before verification,
                  // report it as failed so the download queue can expose a Retry action.
                  val interrupted = cur
                  if (interrupted?.sourceDownloadKey != null && !isDone(interrupted.id) && state != S.IDLE) {
                      finishUploadTraffic()
                      notifyDownloadPipeline(interrupted.sourceDownloadKey, "failed", msg)
                  }
                  running = false
                  isRunning = false
                  busy = false
                  prefs.edit().putBoolean("run_wanted", false).apply()
                  cleanupTemp()
                  releaseWake()
                  releaseUploadNetwork()
                  try { stopService(Intent(this, RbuService::class.java)) } catch (e: Exception) { }
                  log(msg)
                  updateStatus()
              }
          
              private fun releaseWake() {
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  try { if (wifiLock?.isHeld == true) wifiLock?.release() } catch (e: Exception) { }
                  wifiLock = null
              }
          
              private fun skipCurrent() {
                  val skipped = cur
                  skipped?.let { failed.add(it.id) }
                  pendingUri = null
                  busy = false
                  state = S.IDLE
                  if (skipped?.sourceDownloadKey != null) {
                      finishUploadTraffic()
                      notifyDownloadPipeline(skipped.sourceDownloadKey, "failed", "Skipped manually; source file retained")
                      stopRun("Skipped ${skipped.name}. Downloaded source is retained; press Resume / Retry in Downloads.")
                      return
                  }
                  log("Skipped current video.")
              }
          
              private fun fail(msg: String) {
                  finishUploadTraffic()
                  val failedVideo = cur
                  log("  ✖ $msg — failed; source file kept for retry")
                  failedVideo?.let { failed.add(it.id) }
                  state = S.IDLE
                  if (failedVideo?.sourceDownloadKey != null) {
                      notifyDownloadPipeline(failedVideo.sourceDownloadKey, "failed", msg)
                      stopRun("Upload failed for ${failedVideo.name}. The downloaded source was kept. Open Downloads and press Resume / Retry.")
                      return
                  }
                  updateStatus()
              }
          
              private val ticker = object : Runnable {
                  override fun run() {
                      if (!running) return
                      lastBeat = SystemClock.elapsedRealtime()
                      updateUploadTrafficLive()
                      try { tick() } catch (e: Exception) { busy = false; log("Error: " + e) }
                      h.postDelayed(this, 1500)
                  }
              }
          
              // ---------- JS bridge ----------
              private fun unwrap(r: String?): String? {
                  if (r == null || r == "null") return null
                  return try { (JSONTokener(r).nextValue() as? String) ?: r } catch (e: Exception) { r }
              }
          
              private fun runJs(code: String, cb: (String?) -> Unit) {
                  wv.evaluateJavascript(HELPER + "\n" + code) { r -> cb(unwrap(r)) }
              }
          
              private fun tap(x: Float, y: Float) {
                  val t = SystemClock.uptimeMillis()
                  val d = MotionEvent.obtain(t, t, MotionEvent.ACTION_DOWN, x, y, 0)
                  wv.dispatchTouchEvent(d)
                  d.recycle()
                  h.postDelayed({
                      val t2 = SystemClock.uptimeMillis()
                      val u = MotionEvent.obtain(t, t2, MotionEvent.ACTION_UP, x, y, 0)
                      wv.dispatchTouchEvent(u)
                      u.recycle()
                  }, 90)
              }
          
              private fun tapFrom(r: String?) {
                  if (r == null || !r.startsWith("{")) return
                  try {
                      val po = JSONObject(r)
                      val sc = wv.width.toFloat() / po.getDouble("iw").toFloat()
                      tap(po.getDouble("x").toFloat() * sc, po.getDouble("y").toFloat() * sc)
                  } catch (e: Exception) { }
              }
          
              // One-shot category selection: open box, tap option, then (if needed) synthetic click. No looping.
              private fun catSequence(round: Int) {
                  wv.requestFocus()
                  runJs("R.catScroll('box')") { _ ->
                      h.postDelayed({
                          runJs("R.catRect('box')") { r1 ->
                              tapFrom(r1)
                              h.postDelayed({
                                  runJs("R.catScroll('opt')") { _ ->
                                      h.postDelayed({
                                          runJs("R.catRect('opt')") { r2 ->
                                              tapFrom(r2)
                                              h.postDelayed({
                                                  runJs("R.catSynth()") { _ ->
                                                      h.postDelayed({
                                                          busy = false
                                                          log("  category: Entertainment (selected once)")
                                                      }, 1200)
                                                  }
                                              }, 1500)
                                          }
                                      }, 600)
                                  }
                              }, 1000)
                          }
                      }, 600)
                  }
              }
          
              private fun debugDump() {
                  runJs("R.dump()") { r ->
                                        val txt = try { JSONObject(r ?: "{}").toString(2) } catch (e: Exception) { r ?: "(no data)" }
                      log("--- DEBUG ---\n$txt\n--- copied to clipboard ---")
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("rumble-debug", txt))
                  }
              }
          
              // ---------- main state machine ----------
              private fun tick() {
                  if (busy) return
                  val now = SystemClock.elapsedRealtime()
                  val v = cur
                  when (state) {
                      S.IDLE -> {
                          val next = queue.firstOrNull { !isDone(it.id) && !failed.contains(it.id) }
                          if (next == null) {
                              stopRun("Finished. Done: ${doneCount()}/${queue.size}, skipped: ${failed.size}")
                              return
                          }
                          cur = next
                          cleanupTemp()
                          log("▶ ${next.name}")
                          notifyProgress()
                          if (next.zip != null) { startExtract(next); log("  extracting from ZIP...") }
                          pageLoaded = false
                          chooserServed = false
                          pendingUri = null
                          picks = 0
                          stable = 0
                          lastTap = 0
                          catLogged = false
                          stage2Logged = false
                          lastCatTap = 0
                          s1Taps = 0
                          catRounds = 0
                          catWaitLogged = false
                          s2Taps = 0
                          s2First = 0
                          lastS2Tap = 0
                          disLogged = false
                          wv.loadUrl(UPLOAD_URL)
                          state = S.LOADING
                          since = now
                      }
                      S.LOADING -> {
                          if (pageLoaded && extractDone) {
                              val u = wv.url ?: ""
                              if (u.contains("login", true) || u.contains("signin", true)) {
                                  stopRun("Please log in to Rumble in the browser above, then press Start again.")
                                  return
                              }
                              if (v!!.zip != null) {
                                  val ef = extractFile
                                  if (ef == null) {
                                      fail("Could not extract from ZIP: " + (extractErr ?: "unknown error"))
                                      return
                                  }
                                  pendingUri = Uri.fromFile(ef)
                              } else {
                                  pendingUri = v.uri
                              }
                              state = S.PICKING
                              since = now
                          } else if (!pageLoaded && now - since > 60000) {
                              fail("Page did not load")
                          }
                      }
                      S.PICKING -> {
                          busy = true
                          runJs("R.hasTitle()") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              if (chooserServed) {
                                  if (r == "1") {
                                      state = S.UPLOADING
                                      since = t
                                      lastTitleSeen = t
                                      stable = 0
                                      log("  uploading…")
                                  } else if (t - since > 120000) {
                                      fail("Rumble did not show the details form")
                                  }
                              } else if (t - lastTap > 4000) {
                                  lastTap = t
                                  picks++
                                  if (picks > 10) {
                                      stopRun("Could not find the 'select video' button. Tap Debug and send me the text.")
                                  } else {
                                      busy = true
                                      runJs("R.pickRect()") { r2 ->
                                          busy = false
                                          if (r2 != null && r2 != "0") {
                                              val o = JSONObject(r2)
                                              val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                              tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                              log("  tapped: " + o.optString("txt"))
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      S.UPLOADING -> {
                          busy = true
                          val title = cleanTitle(v!!.name.substringBeforeLast('.'))
                          runJs("R.tickForm(" + JSONObject.quote(title) + ")") { r ->
                              val t = SystemClock.elapsedRealtime()
                              val o = try { JSONObject(r ?: "{}") } catch (e: Exception) { JSONObject() }
                              var needCatTap = false
                              if (!o.optBoolean("title")) {
                                  stable = 0
                                  if (t - lastTitleSeen > 120000) fail("Details form disappeared")
                              } else {
                                  lastTitleSeen = t
                                  val unl = o.optString("unl")
                                  val cat = o.optString("cat")
                                  val err = o.optString("err")
                                  val up = o.optBoolean("up")
                                  val ready = o.optString("submit") == "ready"
                                  if (err.isNotEmpty()) {
                                      fail("Rumble says: $err")
                                  } else {
                                      if (up && t - lastPctLog > 20000) {
                                          lastPctLog = t
                                          log("  uploading " + o.optString("pct"))
                                      }
                                      if (catRounds == 0) {
                                          needCatTap = true
                                      }
                                      if (!up && ready) stable++ else stable = 0
                                      if (stable >= 4 && t - since > 15000) {
                                          if (unl != "ok") {
                                              stopRun("Ready to submit, but I could not confirm 'Unlisted' is selected, so I did NOT submit. Tap Debug and send me the text.")
                                          } else if (catRounds == 0) {
                                              // category step has not run yet - let it run first
                                          } else {
                                              state = S.SUBMITTING
                                          }
                                      } else if (t - since > 6 * 3600 * 1000L) {
                                          fail("Upload took too long")
                                      }
                                  }
                              }
                              if (needCatTap && state == S.UPLOADING) {
                                  catRounds++
                                  catSequence(catRounds)
                              } else {
                                  busy = false
                              }
                          }
                      }
                      S.SUBMITTING -> {
                          busy = true
                          runJs("R.submitRect()") { r ->
                              busy = false
                              if (r != null && r != "0") {
                                  try {
                                      val o = JSONObject(r)
                                      val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                      tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                      s1Taps++
                                      urlAtSubmit = wv.url
                                      state = S.CONFIRMING
                                      since = SystemClock.elapsedRealtime()
                                      log("  submitted (real tap " + s1Taps + ")")
                                  } catch (e: Exception) {
                                      stable = 0
                                      state = S.UPLOADING
                                  }
                              } else {
                                  stable = 0
                                  state = S.UPLOADING
                              }
                          }
                      }
                      S.CONFIRMING -> {
                          busy = true
                          runJs("R.s2()") { r ->
                              busy = false
                              val t = SystemClock.elapsedRealtime()
                              val o = try { JSONObject(r ?: "{}") } catch (e: Exception) { JSONObject() }
                              val curUrl = wv.url ?: ""
                              val left = !curUrl.contains("upload", true)
                              val changed = curUrl != (urlAtSubmit ?: "")
                              val s2vis = o.optBoolean("vis")
                              val titleVis = o.optBoolean("title")
                              if (s2vis && s2First == 0L) s2First = t
                              if (left || (s2Taps > 0 && (changed || o.optBoolean("ok")))) {
                                  markDone("")
                              } else if (s2Taps > 0 && !s2vis && !titleVis) {
                                  markDone("")
                              } else if (s2vis) {
                                  if (!stage2Logged) { stage2Logged = true; log("  final page: Personal Use + rights/terms") }
                                  if (o.optBoolean("disabled")) {
                                      if (!disLogged) { disLogged = true; log("  final Submit is greyed out, waiting...") }
                                  } else if (s2Taps >= 6) {
                                      fail("Final Submit did not respond to 6 taps. Tap Debug and send me the text")
                                  } else if (t - s2First > 3000 && t - lastS2Tap > 5000 && o.has("x")) {
                                      val sc = wv.width.toFloat() / o.getDouble("iw").toFloat()
                                      tap(o.getDouble("x").toFloat() * sc, o.getDouble("y").toFloat() * sc)
                                      s2Taps++
                                      lastS2Tap = t
                                      log("  tapped final Submit (" + s2Taps + ")")
                                  }
                              } else if (titleVis && t - since > 8000 && s1Taps < 4) {
                                  state = S.SUBMITTING
                              } else if (t - since > 120000) {
                                  fail("Could not verify the upload on Rumble. The source file has been kept; retry or check Rumble manually.")
                              }
                          }
                      }
                  }
              }
          }
