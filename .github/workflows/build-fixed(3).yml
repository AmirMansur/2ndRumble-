              }
          
              override fun onResume() {
                  super.onResume()
                  visible = true
                  if (!autoBoot) {
                      if (root.visibility != View.VISIBLE) root.visibility = View.VISIBLE
                      if (floating) dock(false)
                  }
                  updateStatus()
              }
          
              override fun onStop() {
                  super.onStop()
                  visible = false
                  // leaving the app while a run is active: keep the browser alive in a small side bubble
                  try { if (running && !floating && !isFinishing && canOverlay()) startFloat(false, false) } catch (e: Exception) { }
              }
          
              override fun onPause() {
                  super.onPause()
                  try { if (acct.isNotEmpty()) saveCookiesFor(acct) } catch (e: Exception) { }
              }
          
              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  isRunning = false
                  if (instance === this) instance = null
                  releaseWake()
                  if (floating) { try { dock(false) } catch (e: Exception) { } }
                  wv.destroy()
                  super.onDestroy()
              }
          
