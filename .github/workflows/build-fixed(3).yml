name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/rbu/uploader app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'RBU_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RumbleUploader"
          include(":app")
          RBU_EOF
          cat > build.gradle.kts <<'RBU_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          RBU_EOF
          cat > gradle.properties <<'RBU_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          RBU_EOF
          cat > app/build.gradle.kts <<'RBU_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rbu.uploader"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rbu.uploader"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          RBU_EOF
          cat > app/src/main/AndroidManifest.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:label="Rumble Batch Uploader"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/RbuTheme"
                      android:launchMode="singleTask"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".DownloadActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />
                  <service
                      android:name=".DlService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
                  <service
                      android:name=".RbuService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
                  <service
                      android:name=".WatchdogService"
                      android:exported="true"
                      android:label="Rumble Uploader watchdog"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/watchdog_config" />
                  </service>
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
                  <receiver
                      android:name=".ControlReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          RBU_EOF
          cat > app/src/main/res/values/styles.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="RbuTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowAnimationStyle">@null</item>
              </style>
          </resources>
          RBU_EOF
          cat > app/src/main/res/values/strings.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="watchdog_desc">Each time you open an app, checks that the Rumble uploader is still running and brings it back if it was closed. It does not read your screen.</string>
          </resources>
          RBU_EOF
          cat > app/src/main/res/xml/watchdog_config.xml <<'RBU_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="300"
              android:description="@string/watchdog_desc" />
          RBU_EOF
