          cat > app/src/main/java/com/rbu/uploader/DlService.kt <<'RBU_EOF'
          package com.rbu.uploader

          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager

          // Keeps downloads running in the background (notification + wake lock).
          class DlService : Service() {
              private var wake: PowerManager.WakeLock? = null
              private val hh = Handler(Looper.getMainLooper())
              private val listener: () -> Unit = { refresh() }
              private val beat = object : Runnable {
                  override fun run() {
                      refresh()
                      hh.postDelayed(this, 5000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  DlEngine.init(this)
                  startFg()
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "rbu:dl")
                      wake?.acquire(12 * 60 * 60 * 1000L)
                  } catch (e: Exception) { }
                  DlEngine.addListener(listener)
                  hh.postDelayed(beat, 5000)
              }

              private fun startFg() {
                  val n = DlEngine.notification()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(DlEngine.ID_RUN, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                      } else {
                          startForeground(DlEngine.ID_RUN, n)
                      }
                  } catch (e: Exception) { }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  DlEngine.init(this)
                  startFg()
                  // intent == null means Android restarted this service after killing the app
                  if (intent == null) {
                      try { DlEngine.resume(applicationContext) } catch (e: Exception) { }
                  }
                  DlEngine.ensureWorker()
                  refresh()
                  return START_STICKY
              }

              private fun refresh() {
                  if (!DlEngine.hasWork() && !DlEngine.workerRunning) {
                      try { stopForeground(true) } catch (e: Exception) { }
                      stopSelf()
                      return
                  }
                  DlEngine.checkHanded()
                  DlEngine.updateNotification()
              }

              override fun onDestroy() {
                  hh.removeCallbacksAndMessages(null)
                  DlEngine.removeListener(listener)
                  try { if (wake?.isHeld == true) wake?.release() } catch (e: Exception) { }
                  super.onDestroy()
              }
          }
