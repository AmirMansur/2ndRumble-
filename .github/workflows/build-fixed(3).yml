                  DlEngine.log("1) Tap 'Select folder' and pick where downloads are saved.\n2) Open a website and tap a download link. It starts right away - there is no Start button.\nVideos and ZIPs go to the uploader automatically. ZIPs are read one video at a time and deleted after their videos are verified on Rumble.\nDownloads stop when only 1 GB of space is left.")
                  DlEngine.resume(applicationContext)
                  refreshLog()
                  refreshStatus()
              }

              override fun onStart() {
                  super.onStart()
                  DlEngine.appVisible = true
                  DlEngine.changed(true)
              }

              override fun onResume() {
                  super.onResume()
                  if (floating) dock()
                  h.removeCallbacks(ticker)
                  h.post(ticker)
                  refreshStatus()
                  checkPrompts()
              }

              override fun onPause() {
                  super.onPause()
                  h.removeCallbacks(ticker)
              }

              override fun onStop() {
                  super.onStop()
                  DlEngine.appVisible = false
                  DlEngine.changed(true)
                  // leaving while downloads are active: keep the browser alive in a small side bubble
                  try { if (DlEngine.hasWork() && !floating && !isFinishing && canOverlay()) startFloat(false, false) } catch (e: Exception) { }
              }

              override fun onDestroy() {
                  DlEngine.removeListener(engineListener)
                  h.removeCallbacksAndMessages(null)
                  if (floating) { try { dock() } catch (e: Exception) { } }
                  try { wv.destroy() } catch (e: Exception) { }
                  super.onDestroy()
              }

              override fun onBackPressed() {
                  if (locked) return
                  if (wv.canGoBack()) {
                      wv.goBack()
                  } else if (DlEngine.hasWork()) {
                      moveTaskToBack(true)
                  } else {
                      super.onBackPressed()
                  }
              }

              // ---------- browser ----------
              private fun go() {
                  val t = address.text.toString().trim()
                  if (t.isEmpty()) return
                  val u = if (t.startsWith("http://", true) || t.startsWith("https://", true)) t
                  else if (t.contains(" ") || !t.contains(".")) "https://www.google.com/search?q=" + Uri.encode(t)
                  else "https://" + t
                  wv.loadUrl(u)
                  address.clearFocus()
              }

              private fun queueDownload(url: String, name: String, mime: String, ua: String) {
                  DlEngine.enqueue(url, name, mime, ua, wv.url ?: "")
                  refreshStatus()
              }

              private fun unwrap(r: String?): String? {
                  if (r == null || r == "null") return null
                  return try { (JSONTokener(r).nextValue() as? String) ?: r } catch (e: Exception) { r }
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun add(url: String?, title: String?, mime: String?) {
                      val u = url?.trim() ?: return
                      if (!u.startsWith("http://", true) && !u.startsWith("https://", true)) return
                      runOnUiThread {
                          // only accept this from the page while Select mode is on
                          if (selectMode) {
                              val n = (title ?: "").ifBlank { Uri.parse(u).lastPathSegment ?: "download" }.take(150)
                              queueDownload(u, n, mime ?: "", UA)
                          }
                      }
                  }
              }

              private fun toggleSelectMode() {
                  selectMode = !selectMode
                  selBtn?.text = if (selectMode) "Select mode: ON" else "Select mode: OFF"
                  wv.evaluateJavascript(SELECT_JS, null)
                  wv.evaluateJavascript("window.__rbuSelectMode=" + selectMode, null)
                  DlEngine.log(if (selectMode) "Select mode ON: tap any link on the page to download it." else "Select mode OFF.")
              }

              private fun selectPage() {
                  wv.evaluateJavascript(SELECT_JS, null)
                  wv.evaluateJavascript("window.__rbuCollect?window.__rbuCollect():'[]'") { r ->
                      val raw = unwrap(r) ?: "[]"
                      val arr = try { JSONArray(raw) } catch (e: Exception) { JSONArray() }
                      if (arr.length() == 0) {
                          DlEngine.log("No downloadable video/ZIP links found on this page. Use Select mode and tap a link, or tap a direct .mp4/.zip link.")
                      } else {
                          AlertDialog.Builder(this)
                              .setTitle("Download from this page")
                              .setMessage("Found " + arr.length() + " downloadable file(s). Download them all now, one after another?")
                              .setPositiveButton("Download all") { _, _ ->
                                  for (i in 0 until arr.length()) {
                                      val o = arr.getJSONObject(i)
                                      queueDownload(o.optString("u"), o.optString("n", "download"), o.optString("m"), UA)
                                  }
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      }
                  }
              }

              private fun openUploader() {
                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                      startActivity(i)
                  } catch (e: Exception) { }
              }

              // ---------- folder ----------
              private fun pickFolder() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                  i.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION or
                          Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION or Intent.FLAG_GRANT_PREFIX_URI_PERMISSION
                  )
                  try {
                      startActivityForResult(i, REQ_TREE)
                  } catch (e: Exception) {
                      DlEngine.log("No file picker available on this phone.")
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_TREE && resultCode == RESULT_OK) {
                      val u = data?.data ?: return
                      try {
                          contentResolver.takePersistableUriPermission(
                              u, Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                          )
                      } catch (e: Exception) { }
                      folderPrompted = false
                      DlEngine.setTree(u)
                      refreshStatus()
                  }
              }

              // ---------- network ----------
              private fun updateNetLabel() {
                  netBtn?.text = if (DlEngine.anyNet()) "Net: Any" else "Net: Mobile"
              }

              private fun toggleNet() {
                  DlEngine.setAnyNet(!DlEngine.anyNet())
                  updateNetLabel()
                  refreshStatus()
              }

              // ---------- status / log / prompts ----------
              private fun watchdogOn(): Boolean {
                  val v = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return v.contains("com.rbu.uploader") && v.contains("WatchdogService")
              }

              private fun refreshStatus() {
                  val free = DlEngine.freeBytes()
                  val usable = maxOf(0L, free - DlEngine.RESERVE)
                  val sb = StringBuilder()
                  sb.append("Folder: ").append(if (DlEngine.tree() == null) "NOT CHOSEN - tap Select folder" else DlEngine.treeName())
                  sb.append("  •  ").append(if (DlEngine.hasWork()) "DOWNLOADING" else "idle")
                  sb.append("  •  watchdog ").append(if (watchdogOn()) "ON" else "OFF").append('\n')
                  sb.append("Free space: ").append(DlEngine.fmt(free)).append("  •  usable before 1 GB reserve: ").append(DlEngine.fmt(usable))
                  var color = Color.WHITE
                  if (free <= DlEngine.RESERVE) {
                      color = Color.parseColor("#FF5252")
                      sb.append("\nSTOPPED: only ").append(DlEngine.fmt(free)).append(" left. Downloads are paused.")
                  } else if (free < DlEngine.WARN) {
                      color = Color.parseColor("#FFB74D")
                      sb.append("\nWarning: less than 2 GB free. Downloads stop when 1 GB is left.")
                  }
                  val act = DlEngine.activeCount()
                  if (act > 0) {
                      sb.append("\nWaiting/active: ").append(act)
                      val c = DlEngine.currentItem
                      if (c != null) {
                          sb.append(" • ").append(c.name)
                          if (c.total > 0) sb.append(" ").append(c.done * 100 / c.total).append("%")
                          else sb.append(" ").append(DlEngine.fmt(c.done))
                      }
                  }
                  val up = DlEngine.handedCount()
                  val upDone = DlEngine.items.count { it.status == "uploaded" }
                  val upFail = DlEngine.items.count { it.status == "upload_failed" }
                  sb.append("\nUploading to Rumble: ").append(up).append("  •  verified: ").append(upDone).append("  •  upload failed: ").append(upFail)
                  sb.append("  •  downloads: ").append(if (DlEngine.anyNet()) "any network" else "mobile data only")
                  val br = DlEngine.blockReason
                  if (br != null) sb.append('\n').append(br)
                  statusView.text = sb.toString()
                  statusView.setTextColor(color)
              }

              private fun refreshLog() {
                  val v = DlEngine.logVersion
                  if (v == lastLogVersion) return
                  lastLogVersion = v
                  logView.text = DlEngine.logSnapshot()
                  logScroll.post { logScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun checkPrompts() {
                  if (isFinishing) return
                  if (DlEngine.tree() == null && DlEngine.items.any { it.status == "queued" } && !folderPrompted) {
                      folderPrompted = true
                      AlertDialog.Builder(this)
                          .setTitle("Choose a download folder")
                          .setMessage("Pick the folder where your downloads should be saved. Tip: create or pick a sub-folder (Android does not allow choosing the Download root itself).")
                          .setPositiveButton("Select folder") { _, _ -> pickFolder() }
                          .setNegativeButton("Later", null)
                          .show()
                      return
                  }
                  val w = DlEngine.lastWarning
                  if (w != null && DlEngine.appVisible && !warnShowing) {
                      DlEngine.lastWarning = null
                      warnShowing = true
                      AlertDialog.Builder(this)
                          .setTitle("Warning")
                          .setMessage(w)
                          .setPositiveButton("OK", null)
                          .setOnDismissListener { warnShowing = false }
                          .show()
                  }
              }

              // ---------- downloads list ----------
              private fun label(x: DlItem): String {
                  return when (x.status) {
                      "queued" -> "Waiting"
                      "downloading" -> "Downloading " + (if (x.total > 0) (x.done * 100 / x.total).toString() + "% (" + DlEngine.fmt(x.done) + " of " + DlEngine.fmt(x.total) + ")" else DlEngine.fmt(x.done))
                      "handed" -> "Downloaded - uploading to Rumble"
                      "uploaded" -> "Uploaded and verified on Rumble"
                      "upload_failed" -> "UPLOAD FAILED - " + x.detail
                      "done" -> "Saved" + (if (x.detail.isNotEmpty()) " - " + x.detail else "")
                      "failed" -> "FAILED - " + x.detail
                      "canceled" -> "Canceled"
                      else -> x.status
                  }
              }

              private fun showDownloads() {
                  val list = DlEngine.items.toList().reversed()
                  val lines = if (list.isEmpty()) arrayOf("No downloads yet") else list.map { it.name + "\n   " + label(it) }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Downloads")
                      .setItems(lines) { _, which -> if (list.isNotEmpty()) itemActions(list[which]) }
                      .setPositiveButton("Close", null)
                      .setNeutralButton("Clear finished") { _, _ -> DlEngine.clearFinished() }
                      .setNegativeButton("Refresh") { _, _ -> showDownloads() }
                      .show()
              }

              private fun itemActions(x: DlItem) {
                  val opts = when (x.status) {
                      "queued", "downloading" -> arrayOf("Cancel this download")
                      "failed", "canceled" -> arrayOf("Retry download", "Remove from list")
                      "upload_failed" -> arrayOf("Retry upload", "Remove from list")
                      "handed" -> arrayOf("Retry upload", "Open uploader")
                      else -> arrayOf("Remove from list")
                  }
                  AlertDialog.Builder(this)
                      .setTitle(x.name)
                      .setMessage(label(x))
                      .setItems(opts) { _, w ->
                          when (opts[w]) {
                              "Cancel this download" -> DlEngine.cancel(x)
                              "Retry download" -> DlEngine.retryDownload(x)
                              "Retry upload" -> DlEngine.retryUpload(x)
                              "Open uploader" -> openUploader()
                              else -> DlEngine.remove(x)
                          }
                      }
                      .setNegativeButton("Back", null)
                      .show()
              }

              // ---------- lock / dim ----------
              private fun resetBrightness() {
                  val a = window.attributes
                  a.screenBrightness = WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE
                  window.attributes = a
              }

              private fun lockScreen(dim: Boolean) {
                  locked = true
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  if (dim) {
                      lockLayer.setBackgroundColor(Color.BLACK)
                      lockLabel.text = ""
                      unlockBtn.setTextColor(Color.parseColor("#777777"))
                      unlockBtn.setBackgroundColor(Color.parseColor("#151515"))
                      val a = window.attributes
                      a.screenBrightness = 0.01f
                      window.attributes = a
                  } else {
                      lockLayer.setBackgroundColor(Color.parseColor("#66000000"))
                      lockLabel.text = "🔒 Locked"
                      unlockBtn.setTextColor(Color.WHITE)
                      unlockBtn.setBackgroundColor(Color.parseColor("#CC333333"))
                      resetBrightness()
                  }
                  lockLayer.visibility = View.VISIBLE
              }

              private fun unlockScreen() {
                  locked = false
                  lockLayer.visibility = View.GONE
                  window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  resetBrightness()
              }

              // ---------- floating window ----------
              private fun toggleFloat() {
                  if (floating) dock() else startFloat()
              }

              private fun makeShield(lp: WindowManager.LayoutParams, wm: WindowManager, box: View): View {
                  val shield = View(this)
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var dragged = false
                  shield.setOnTouchListener { _, ev ->
                      when (ev.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              startX = lp.x
                              startY = lp.y
                              dragged = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = ev.rawX - downX
                              val dy = ev.rawY - downY
                              if (!dragged && (Math.abs(dx) > dp(12) || Math.abs(dy) > dp(12))) dragged = true
                              if (dragged) {
                                  lp.x = startX + dx.toInt()
                                  lp.y = startY + dy.toInt()
                                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!dragged) floatTap() else snapToSide(lp, wm, box)
                          }
                      }
                      true
                  }
                  return shield
              }

              private fun floatTap() {
                  val now = android.os.SystemClock.elapsedRealtime()
                  if (now - lastFloatTap > 700) floatTaps = 0
                  lastFloatTap = now
                  floatTaps++
                  if (floatTaps >= 3) {
                      floatTaps = 0
                      h.post {
                          dock()
                          try {
                              val i = Intent(this, DownloadActivity::class.java)
                              i.addFlags(Intent.FLAG_ACTIVITY_REORDER_TO_FRONT or Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(i)
                          } catch (e: Exception) { }
                      }
                  }
              }

              private fun startFloat(moveBack: Boolean = true, prompt: Boolean = true) {
                  if (floating) return
                  if (!canOverlay()) {
                      if (prompt) {
                          DlEngine.log("Allow 'Display over other apps' for this app on the screen that just opened, then tap Float again.")
                          try {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                          } catch (e: Exception) { }
                      }
                      return
                  }
                  val mp = ViewGroup.LayoutParams.MATCH_PARENT
                  val dm = resources.displayMetrics
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val idx = root.indexOfChild(wv)
                  root.removeView(wv)
                  val ph = TextView(this)
                  ph.text = "Browser is floating as a small bubble.\nTriple-tap the bubble, or press Dock, to bring it back."
                  ph.setTextColor(Color.WHITE)
                  ph.gravity = Gravity.CENTER
                  root.addView(ph, if (idx < 0) root.childCount else idx, LinearLayout.LayoutParams(mp, 0, 4f))
                  placeholder = ph

                  // Bubble is tiny, but the real WebView inside it keeps a normal working size and is just scaled down.
                  val bubblePx = dp(52)
                  val innerPx = dp(360)
                  val innerH = dp(640)
                  val scale = bubblePx.toFloat() / innerPx.toFloat()

                  val box = FrameLayout(this)
                  box.clipChildren = true
                  box.clipToOutline = true
                  box.background = android.graphics.drawable.GradientDrawable().apply {
                      shape = android.graphics.drawable.GradientDrawable.OVAL
                      setColor(Color.parseColor("#9FE870"))
                      setStroke(dp(2), Color.parseColor("#1b5e20"))
                  }
                  box.addView(wv, FrameLayout.LayoutParams(innerPx, innerH))
                  wv.pivotX = 0f
                  wv.pivotY = 0f
                  wv.scaleX = scale
                  wv.scaleY = scale

                  val type = if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
                  val lp = WindowManager.LayoutParams(
                      bubblePx, bubblePx,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val margin = dp(4)
                  val savedX = DlEngine.prefs.getInt("bx", dm.widthPixels - bubblePx - margin)
                  lp.x = if (savedX + bubblePx / 2 < dm.widthPixels / 2) margin else dm.widthPixels - bubblePx - margin
                  lp.y = DlEngine.prefs.getInt("by", (dm.heightPixels * 0.45f).toInt()).coerceIn(dp(40), dm.heightPixels - bubblePx - dp(90))
                  box.addView(makeShield(lp, wm, box), FrameLayout.LayoutParams(mp, mp))
                  wm.addView(box, lp)
                  floatBox = box
                  floating = true
                  floatBtn?.text = "Dock"
                  if (prompt) DlEngine.log("Floating as a small bubble at the side. Drag it to move it; triple-tap it to open the app.")
                  if (moveBack) h.postDelayed({ moveTaskToBack(true) }, 400)
              }

              private fun dock() {
                  if (!floating) return
                  val box = floatBox
                  val wm = applicationContext.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  try { if (box != null) wm.removeView(box) } catch (e: Exception) { }
                  try { box?.removeView(wv) } catch (e: Exception) { }
                  wv.scaleX = 1f
                  wv.scaleY = 1f
                  wv.pivotX = (wv.width / 2).toFloat()
                  wv.pivotY = (wv.height / 2).toFloat()
                  var idx = root.childCount
                  val ph = placeholder
                  if (ph != null) {
                      idx = root.indexOfChild(ph)
                      root.removeView(ph)
                  }
                  if (idx < 0) idx = root.childCount
                  if (wv.parent == null) root.addView(wv, idx, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 4f))
                  floatBox = null
                  placeholder = null
                  floating = false
                  floatBtn?.text = "Float"
              }

              private fun snapToSide(lp: WindowManager.LayoutParams, wm: WindowManager, box: View) {
                  val dm = resources.displayMetrics
                  val size = lp.width
                  val margin = dp(4)
                  lp.x = if (lp.x + size / 2 < dm.widthPixels / 2) margin else dm.widthPixels - size - margin
                  val minY = dp(40)
                  val maxY = dm.heightPixels - size - dp(90)
                  if (lp.y < minY) lp.y = minY
                  if (lp.y > maxY) lp.y = maxY
                  try { wm.updateViewLayout(box, lp) } catch (e: Exception) { }
                  DlEngine.prefs.edit().putInt("bx", lp.x).putInt("by", lp.y).apply()
              }

              // ---------- watchdog / battery ----------
              private fun setupWatchdog() {
                  val on = watchdogOn()
                  val msg = if (on) {
                      "The watchdog is ON.\n\nEvery time you open an app it checks the app. If it was killed, downloads continue by themselves."
                  } else {
                      "The watchdog is OFF.\n\n1) Tap 'Open settings'.\n2) Find 'Rumble Batch Uploader' and turn it ON. If the switch is greyed out, tap it once, then go to Settings > Apps > Rumble Batch Uploader > three dots (top right) > 'Allow restricted settings', and try again.\n\nIt only notices which app opens. It does not read your screen."
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Auto-revive watchdog")
                      .setMessage(msg)
                      .setPositiveButton("Open settings") { _, _ ->
                          try { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) } catch (e: Exception) { }
                      }
                      .setNegativeButton("Close", null)
                      .show()
              }

              private fun batterySetting() {
                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (pm.isIgnoringBatteryOptimizations(packageName)) {
                          DlEngine.log("Battery: already unrestricted for this app.")
                      } else {
                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                          i.data = Uri.parse("package:" + packageName)
                          startActivity(i)
                          DlEngine.log("Allow 'unrestricted battery use' on the screen that just opened.")
                      }
                  } catch (e: Exception) { }
              }
          }
