          package com.rbu.uploader

          import android.accessibilityservice.AccessibilityService
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent

          // Like an app locker: every time any app opens, check that the uploader is alive.
          // It only listens for "a window changed" - it does not read anything on the screen.
          class WatchdogService : AccessibilityService() {
              private var last = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  try { Revive.ensure(applicationContext) } catch (e: Exception) { }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val now = SystemClock.elapsedRealtime()
                  if (now - last < 2500) return
                  last = now
                  try { Revive.ensure(applicationContext) } catch (e: Exception) { }
              }

              override fun onInterrupt() { }
          }
